<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Screen · WASH Retreat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  html,body{height:100%}
  body{font-size:clamp(16px,1.6vw,34px);overflow:hidden}
  .scr{height:100%;display:flex;flex-direction:column;padding:clamp(16px,2.6vw,56px);padding-left:max(clamp(16px,2.6vw,56px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.6vw,56px),env(safe-area-inset-right,0px));gap:1em}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:1em;flex-wrap:wrap}
  .sess-steps{font-size:1.5em;line-height:1.35;margin:.4em 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:.45em}
  .sess-steps li::marker{color:var(--accent);font-weight:800}
  .wcard{background:#fff;color:#1B2430;border-radius:.6em;padding:1em 1.2em;box-shadow:0 .4em 1.4em rgba(0,0,0,.15);transform:rotate(-1.5deg);font-size:.8em;border-top:.5em solid var(--accent)}
  .wc-top{font-weight:700;letter-spacing:.06em;color:var(--accent);font-size:.75em}.wc-h{font-family:var(--display);font-weight:800;font-size:2em;margin:.2em 0}.wc-sub{color:#5B6573}
  .wc-ticks{display:flex;flex-direction:column;gap:.5em;margin:.8em 0}.wc-ticks div{display:flex;gap:.6em;align-items:center}.wc-ticks span{flex:0 0 1em;height:1em;border:.12em solid var(--accent);border-radius:.2em}
  .wc-q{font-weight:700;color:var(--accent);border-top:1px dashed #ccc;padding-top:.6em}
  .wheel{display:flex;flex-direction:column;align-items:center;gap:1em;margin-block:auto}
  .wheel .disc{width:9em;height:9em;border-radius:50%;background:conic-gradient(var(--t1) 0 120deg,var(--t2) 120deg 240deg,var(--t3) 240deg 360deg);animation:spin 2.4s cubic-bezier(.15,.8,.25,1) both;border:.3em solid #fff;box-shadow:0 .3em 1em rgba(0,0,0,.2)}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(1980deg)}}
  .wheel ol{font-size:1.8em;font-weight:800;margin:0;padding-left:1.4em;opacity:0;animation:show .6s 2.3s forwards}
  @keyframes show{to{opacity:1}}
  .tpage{display:flex;flex-direction:column;gap:.6em;flex:1;min-height:0;overflow:hidden}
  .tpage .pr{font-weight:600;color:var(--accent);font-size:1.1em}
  .tpage .boxes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1em;flex:1;min-height:0}
  .tpage .bx{background:var(--surface);border-top:.3em solid var(--tc);border-radius:.5em;padding:.6em .8em;overflow:hidden;font-size:.85em;white-space:pre-wrap;overflow-wrap:anywhere}
  .tpage .bx h3{font-size:.8em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 .3em}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .confetti i{position:absolute;top:-4vh;width:.5em;height:1em;border-radius:.15em;animation:fall 3.2s linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .podium.win .place{animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both}.podium.win .p2{animation-delay:.4s}.podium.win .p1{animation-delay:.9s}.podium.win .p3{animation-delay:0s}
  @keyframes rise{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
  .birds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em;flex:1;min-height:0}
  .bird{background:var(--surface);border-radius:.6em;border-top:.35em solid var(--tc);padding:.7em .9em;display:flex;flex-direction:column;gap:.4em;min-height:0;overflow:hidden}
  .bird .bh{display:flex;gap:.6em;align-items:center;color:var(--tc)}.bird .bh svg{width:3.4em;height:3.4em;flex:none}
  .bird .bh b{display:block;font-family:var(--display);font-size:1.5em;color:var(--tc);line-height:1}.bird .bh span{font-size:.75em;color:var(--muted)}
  .bird ol{margin:0;padding-left:1.4em;font-size:.95em;line-height:1.45;columns:1}
  .demo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:2em;align-items:center;flex:1;min-height:0}
  .demo .cap{display:flex;flex-direction:column;gap:.5em}.demo .cap h1{font-family:var(--display);font-size:2.4em;line-height:1.05;margin:0}.demo .cap p{font-size:1.25em;margin:0;line-height:1.4}
  .steps{display:flex;gap:.3em}.steps i{width:1.6em;height:.35em;border-radius:.2em;background:var(--line)}.steps i.on{background:var(--accent)}
  .phone{justify-self:center;width:16em;height:29em;border-radius:2em;background:#1B2430;padding:.7em;box-shadow:0 .6em 2em rgba(0,0,0,.25);animation:pin .5s ease both}
  @keyframes pin{from{transform:translateY(1em);opacity:0}to{transform:none;opacity:1}}
  .phone .scr{background:#F4F8F8;border-radius:1.4em;height:100%;overflow:hidden;padding:.8em;display:flex;flex-direction:column;gap:.45em;font-size:.8em;color:#1B2430}
  .phone .c{background:#fff;border:1px solid #d6e0e2;border-radius:.8em;padding:.6em .7em;display:flex;flex-direction:column;gap:.35em}
  .phone .ey{font-size:.75em;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
  .phone .b{background:var(--accent);color:#fff;border-radius:.6em;padding:.55em;text-align:center;font-weight:700}
  .phone .o{border:1px solid #d6e0e2;border-radius:.5em;padding:.35em .5em}.phone .o.sel{border-color:var(--accent);background:#E3F2F3;font-weight:700}
  .phone .bad{background:#FDECEC;border-color:#F3B5B5}.phone .good{background:#E7F6EA;border-color:#A9DDB2}
  .phone .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.35em}.phone .grid span{border:2px solid #d6e0e2;border-radius:.5em;text-align:center;padding:.5em 0;font-weight:800}.phone .grid .d{background:#2E7D32;color:#fff;border-color:#2E7D32}
  .paper{background:#fff;border-radius:.5em;padding:.8em 1em;box-shadow:0 .3em 1em rgba(0,0,0,.12);font-size:.95em;line-height:1.45;transform:rotate(-1deg);border-top:.35em solid var(--accent)}
  .typing{border-right:.12em solid var(--accent);animation:blink 1s step-end infinite}@keyframes blink{50%{border-color:transparent}}
  .kick{font-size:.75em;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
  .ttl{font-family:var(--display);font-weight:800;font-size:2.3em;line-height:1.05;letter-spacing:-.01em;text-wrap:balance;margin:0}
  .main{flex:1;min-height:0;display:flex;flex-direction:column;gap:1em}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:1em;color:var(--muted);font-size:.7em}
  .foot b{color:var(--ink);font-family:var(--mono)}
  .bars{display:flex;flex-direction:column;gap:.9em;margin-block:auto}
  .bar{display:grid;grid-template-columns:minmax(5em,14em) minmax(0,1fr) 4em;gap:.8em;align-items:center}
  .bar .lab{display:flex;align-items:center;gap:.5em;font-weight:600;min-width:0}
  .bar .lab span:last-child{overflow-wrap:anywhere}
  .bar .k{font-family:var(--display);font-weight:800;color:var(--accent);width:1.4em;flex:none}
  .track{height:1.9em;background:var(--soft);border-radius:999px;overflow:hidden}
  .fill{height:100%;background:var(--tc,var(--accent));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .num{font-family:var(--mono);font-weight:600;font-size:1.4em;text-align:right;font-variant-numeric:tabular-nums}
  .bar.right .fill{background:var(--good)} .bar.right .k{color:var(--good)}
  .bar.dim{opacity:.45}
  .lobby{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2.4em;align-items:center}
  .qr{background:#fff;padding:.7em;border-radius:.6em;line-height:0}
  .qr img,.qr canvas{width:min(34vh,26vw)!important;height:auto!important;display:block}
  .url{font-family:var(--display);font-weight:800;font-size:2.2em;line-height:1.05;overflow-wrap:anywhere}
  .teamcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em}
  .teamcol{border-top:.3em solid var(--tc);padding-top:.4em;min-width:0}
  .teamcol h3{font-size:1.1em;display:flex;justify-content:space-between;gap:.5em}
  .names{display:flex;flex-wrap:wrap;gap:.25em .7em;font-size:.75em;margin-top:.3em}
  .cloud{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:baseline;gap:.15em .7em}
  .cloud span{font-family:var(--display);font-weight:800;line-height:1.05;color:var(--wc)}
  .w0{--wc:var(--t1)} .w1{--wc:var(--t2)} .w2{--wc:var(--t3)} .w3{--wc:var(--accent)} .w4{--wc:var(--ink)}
  .opens{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:.7em;align-content:start;overflow:hidden}
  .opens div{background:var(--surface);border:1px solid var(--line);border-radius:.6em;padding:.6em .8em;font-size:.85em;overflow-wrap:anywhere}
  .rating{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2em;align-items:center;margin-block:auto}
  .avg{font-family:var(--display);font-weight:800;font-size:6em;line-height:1;color:var(--accent)}
  .big-timer{font-family:var(--mono);font-weight:600;font-size:2em;font-variant-numeric:tabular-nums}
  .big-timer.low{color:var(--t2)}
  .lb{display:flex;flex-direction:column;gap:.45em;margin-block:auto}
  .lb-row{display:grid;grid-template-columns:2em minmax(0,1fr) 6em;gap:.8em;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:.35em solid var(--tc);border-radius:.5em;padding:.4em .8em}
  .lb-row .rk{font-family:var(--display);font-weight:800;color:var(--muted)}
  .lb-row .nm{font-weight:600;overflow-wrap:anywhere}
  .lb-row .pt{font-family:var(--mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .lb-row.first{font-size:1.15em}
  .podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2em;align-items:end;flex:1}
  .place{display:flex;flex-direction:column;align-items:center;gap:.4em;text-align:center;min-width:0}
  .place .pn{font-family:var(--display);font-weight:800;font-size:1.6em;line-height:1.1;overflow-wrap:anywhere}
  .place .pp{font-family:var(--mono);color:var(--muted)}
  .plinth{width:100%;border-radius:.5em .5em 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.4em;background:var(--soft);color:var(--muted)}
  .place.on .plinth{background:var(--tc);color:var(--on-team)}
  .p1 .plinth{height:42vh} .p2 .plinth{height:30vh} .p3 .plinth{height:20vh}
  .hunt{display:flex;flex-direction:column;gap:1.2em;margin-block:auto}
  .hunt-head{display:flex;justify-content:space-between;align-items:baseline;gap:.6em;flex-wrap:wrap}
  .hunt-head b{display:flex;align-items:center;gap:.5em;font-size:1.2em}
  .tiles{display:flex;flex-wrap:wrap;gap:.35em;margin-top:.35em}
  .tiles span{width:1.9em;height:2.3em;display:grid;place-items:center;border:.12em solid var(--line);border-radius:.3em;font-family:var(--display);font-weight:800;font-size:1.3em}
  .tiles span.on{background:var(--tc);border-color:var(--tc);color:var(--on-team)}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:30em}
  .empty b{display:block;font-family:var(--display);font-size:2em;color:var(--ink)}
  .mini{display:flex;align-items:center;gap:.6em}
  .mini .qr{padding:.25em;border-radius:.3em}
  .mini .qr img,.mini .qr canvas{width:3.4em!important}
  .board{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.6em;overflow:hidden}
  .bcol{display:flex;flex-direction:column;gap:.35em;min-width:0;overflow:hidden}
  .bcol h3{font-size:.72em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--body);font-weight:600;min-height:2.6em}
  .stick{background:var(--surface);border:1px solid var(--line);border-left:.35em solid var(--nc,var(--accent));border-radius:.35em;padding:.3em .45em;font-size:.62em;line-height:1.3;overflow-wrap:anywhere}
  .stick b{float:right;font-family:var(--mono);margin-left:.4em}
  .n0{--nc:var(--good)} .n1{--nc:var(--bad)} .n2{--nc:var(--gold)} .n3{--nc:var(--t1)} .n4{--nc:var(--t3)}
  .legend{display:flex;gap:1.2em;font-size:.7em;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:.4em}
  .legend i{width:.8em;height:.8em;border-radius:.2em;background:var(--nc);display:inline-block}
  .teams3{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em;overflow:hidden}
  .tsheet{border-top:.3em solid var(--tc);background:var(--surface);border-radius:.5em;padding:.6em .8em;display:flex;flex-direction:column;gap:.45em;min-width:0;overflow:hidden;font-size:.72em}
  .tsheet h3{font-size:1.3em}
  .tsheet .pr{font-weight:600;color:var(--accent)}
  .tsheet .fl{font-size:.8em;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:.3em}
  .tsheet ul{margin:0;padding-left:1.1em}
  .tsheet li{margin:.1em 0;overflow-wrap:anywhere}
  .tsheet .tg{font-weight:700}
  @media (max-width:760px){.lobby{grid-template-columns:minmax(0,1fr)}.teamcols{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="scr" id="scr"><div class="empty"><b>Loading…</b></div></div>
<div id="qr-src" hidden></div>
<div id="qr-mini" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/config.js"></script>
<script src="/sessions.js"></script>
<script src="/lib.js"></script>
<script>
(function () {
  const { $, esc, LETTERS, teamClass, rpc, rows, live, syncClock, now } = WR;
  const scr = $('#scr');
  if (!WR.configured) { scr.innerHTML = '<div class="empty"><b>Setup needed</b>Add the Supabase details in config.js.</div>'; return; }
  const joinUrl = location.origin + '/';
  const host = location.host.replace(/^www\./, '');
  try {
    new QRCode($('#qr-src'), { text: joinUrl, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
    new QRCode($('#qr-mini'), { text: joinUrl, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
  } catch (e) {}
  const qrCache = {};
  const qrImg = (id) => {
    if (!qrCache[id]) {
      const n = $(id); const c = n && n.querySelector('canvas'); const i = n && n.querySelector('img[src]');
      try { qrCache[id] = c ? c.toDataURL('image/png') : i ? i.src : ''; } catch (e) { qrCache[id] = i ? i.src : ''; }
    }
    return qrCache[id] ? `<div class="qr"><img src="${qrCache[id]}" alt="QR code to join"></div>` : '';
  };

  let D = { st: null, teams: [], players: [], acts: [], resp: [], board: null, hunt: null };
  let lastHtml = '';

  async function refresh() {
    const [st, teams, players, acts] = await Promise.all([rows('state'), rows('teams', (q) => q.order('id')), rows('participants'), rows('activities', (q) => q.order('position'))]);
    D.st = st[0] || {}; D.teams = teams; D.players = players; D.acts = acts;
    const screen = D.st.screen;
    if (screen === 'activity' && D.st.activity_id) {
      D.resp = await rows('responses', (q) => q.eq('activity_id', D.st.activity_id));
      const a = acts.find((x) => x.id === D.st.activity_id);
      if (a && a.kind === 'board') { D.notes = await rows('notes', (q) => q.eq('activity_id', a.id).order('id')); }
      if (a && a.kind === 'dots') {
        const bid = (a.options || {}).board;
        const [n, v] = await Promise.all([rows('notes', (q) => q.eq('activity_id', bid).order('id')), rows('note_votes', (q) => q.eq('activity_id', a.id))]);
        D.notes = n; D.votes = v; D.boardAct = acts.find((x) => x.id === bid) || null;
      }
      if (a && a.kind === 'team') D.entries = await rows('team_entries', (q) => q.eq('activity_id', a.id));
    }
    else if (screen === 'leaderboard') { const qa = acts.filter((x) => x.kind === 'quiz').map((x) => x.id); D.resp = qa.length ? await rows('responses', (q) => q.in('activity_id', qa)) : []; }
    if (screen === 'teams' || screen === 'podium') D.board = await rpc('scoreboard');
    if (screen === 'hunt') { D.hunt = await rpc('hunt_board'); D.board = await rpc('scoreboard'); D.race = (D.st.present && D.st.present.race) ? await rpc('race_result') : null; }
    paint();
  }

  const teamName = (id) => (D.teams.find((t) => t.id === id) || {}).name || 'Team';
  const playerName = (id) => (D.players.find((p) => p.id === id) || {}).name || 'Someone';

  function foot() {
    const s = curSession();
    const a = D.st.screen === 'activity' ? D.acts.find((x) => x.id === D.st.activity_id) : null;
    const cnt = a && a.kind !== 'team' ? `<span class="muted" style="margin-left:auto;margin-right:1.2em">${new Set((D.resp || []).map((r) => r.participant_id)).size}/${D.players.length} answered</span>` : '';
    return `<div class="foot"><span>${esc(host)}</span>${cnt}<span>${s ? 'Day ' + s.day + ' · ' + esc(s.label) + ' · ' + esc(s.title) : esc(WR.cfg.eventName)}</span></div>`;
  }

  function curSession() {
    const S = window.WR_SESSIONS; if (!S) return null;
    if (D.st.screen === 'session' || D.st.screen === 'hunt') return S.get(D.st.session_key);
    const a = D.acts.find((x) => x.id === D.st.activity_id); return a ? S.of(a.position) : null;
  }
  function vSession() {
    if (D.st.session_key === 'end') return `<div class="stack" style="gap:.6em;margin-block:auto;align-items:center;text-align:center"><img src="/logo.png" alt="WaSH Sector Lebanon" style="height:3em;width:auto"><h1 class="ttl" style="font-size:3.6em">Thank you for joining!</h1><div style="font-size:1.5em;color:var(--muted)">Where the Waters Meet · WASH Sector Coordination Team Retreat</div></div>`;
    const s = (window.WR_SESSIONS && WR_SESSIONS.get(D.st.session_key)) || null;
    if (!s) return vLobby();
    if (s.demo && D.st.present && D.st.present.demo != null) return vDemo(s, D.st.present.demo);
    if (s.card) return `<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.4em;align-items:center;margin-block:auto"><div class="stack" style="gap:.5em"><div class="kick">Day ${s.day} · ${esc(s.label)} · ${esc(s.time)}</div><h1 class="ttl" style="font-size:3em">${esc(s.title)}</h1>${s.sub ? `<div style="font-size:1.3em;font-weight:600;color:var(--muted)">${esc(s.sub)}</div>` : ''}<ol class="sess-steps" style="font-size:1.2em">${s.show.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></div>
      <div class="wcard"><div class="wc-top">WHERE THE WATERS MEET · SAFE HARBOUR</div><div class="wc-h">Welcome, Waterman!</div><div class="wc-sub">This room is your safe harbour for tonight.</div><div class="wc-ticks">${['Be back at <b>15:00 sharp</b> in the meeting room', 'Be down at <b>17:00 sharp</b> to move to Wadi Chamsine', 'Take your breakfast and <b>check out before 11:00</b>', 'We move at <b>11:30 sharp</b> to Taanayel'].map((x) => `<div><span></span>${x}</div>`).join('')}</div><div class="wc-q">A message washed up in your room… scan it</div></div></div>`;
    return `<div class="stack" style="gap:.5em;margin-block:auto"><div class="kick">Day ${s.day} · ${esc(s.label)} · ${esc(s.time)}</div><h1 class="ttl" style="font-size:3.4em">${esc(s.title)}</h1>${s.sub ? `<div style="font-size:1.6em;font-weight:600;color:var(--muted)">${esc(s.sub)}</div>` : ''}
      <ol class="sess-steps">${s.show.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
  }
  // Team birds (simple drawings, in the team colour).
  const BIRD = {
    1: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M38 6c4 0 6 3 5 6l9 2-9 2c-1 4-4 6-6 9-3 5 2 11 1 18-1 6-7 9-13 9l-2 10h-2l2-10h-3l-1 10h-2l1-10c-5-2-7-7-6-12 2-8 12-10 16-16 2-4 1-8 2-12 1-3 4-6 8-6z" fill="currentColor"/></svg>',
    2: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M30 14c9 0 15 6 16 13l16 3-16 3c-1 9-8 17-18 17-4 0-7-1-9-3l-9 7 4-10c-2-3-3-7-3-11 0-11 8-19 19-19z" fill="currentColor"/><circle cx="36" cy="25" r="2.5" fill="#fff"/></svg>',

    return `<div class="stack" style="gap:.6em;min-width:0;margin-bottom:.6em">
      <img src="/logo.png" alt="WaSH Sector Lebanon" style="height:2.4em;width:auto;align-self:flex-start"><div class="kick">${esc(WR.cfg.eventName)}</div><div class="ttl">Welcome! Scan your badge</div>
      <div class="muted">${D.players.length} checked in</div></div>
      <div class="teamcols">${byTeam.map(({ t, ps }) => `<div class="teamcol ${teamClass(t.id)}"><h3><span>${esc(t.name)}</span><span class="timer">${ps.length}</span></h3><div class="names">${ps.map((p) => `<span>${esc(p.name)}</span>`).join('')}</div></div>`).join('')}</div>`;

  function joinedBlock(msg) {
    return `<div class="stack" style="gap:.8em;margin-block:auto"><div class="spread"><b style="font-family:var(--display);font-size:1.6em">${esc(msg)}</b><span class="timer" style="font-size:1.6em">${D.players.length} joined</span></div>
      <div class="teamcols">${D.teams.map((t) => { const ps = D.players.filter((p) => p.team_id === t.id); return `<div class="teamcol ${teamClass(t.id)}"><h3><span>${esc(t.name)}</span><span class="timer">${ps.length}</span></h3><div class="names">${ps.map((p) => `<span>${esc(p.name)}</span>`).join('')}</div></div>`; }).join('')}</div></div>`;

  function bars(items, max, cls) {

      <div class="track"><div class="fill" style="width:${Math.max(1.5, (it.n / Math.max(1, max)) * 100)}%"></div></div><div class="num">${it.n}</div></div>`).join('')}</div>`;
  }

  function vActivity() {
    const st = D.st, a = D.acts.find((x) => x.id === st.activity_id);
    if (!a) return `<div class="empty"><b>Get ready</b>The next question is coming.</div>`;
    const R = D.resp; let count = R.length;
    if (a.kind === 'board') count = (D.notes || []).length;
    if (a.kind === 'dots') count = new Set((D.votes || []).map((v) => v.participant_id)).size;
    if (a.kind === 'team') count = (D.entries || []).length;
    const status = st.phase === 'open' ? (a.kind === 'quiz' ? '' : `${count} ${({ board: 'notes', dots: 'people voted', team: 'teams writing' })[a.kind] || (count === 1 ? 'answer' : 'answers')}`)
      : st.phase === 'idle' ? 'Get ready' : st.phase === 'reveal' ? 'Answer' : 'Answers closed';
    const head = `<div class="top"><div class="stack" style="gap:.3em;min-width:0"><div class="kick">${({ poll: 'Vote on your phone', quiz: 'Quiz', words: 'Word cloud', rating: 'Rating', open: 'Open question', board: 'Sticky notes · on your phone', dots: 'Dot vote · on your phone', team: 'Team worksheets', allocate: 'Share your points' })[a.kind]}</div><h1 class="ttl">${esc(a.title)}</h1></div>
      <div class="stack" style="align-items:flex-end;gap:.2em">${a.kind === 'quiz' && st.phase === 'open' ? `<span class="big-timer" data-timer></span><span class="muted">${count} answered</span>` : `<span class="muted">${status}</span>`}</div></div>`;

    if (st.phase === 'idle') return head + joinedBlock('Phones ready? Answers open in a moment.');

    if (a.kind === 'board' || a.kind === 'dots') {
      const ba = a.kind === 'dots' ? (D.boardAct || { options: {} }) : a;
      const cols = (ba.options || {}).columns || []; const tags = (ba.options || {}).tags || [];
      const votes = new Map(); (D.votes || []).forEach((v) => votes.set(v.note_id, (votes.get(v.note_id) || 0) + 1));
      const notes = (D.notes || []).slice();
      if (a.kind === 'dots') notes.sort((x, y) => (votes.get(y.id) || 0) - (votes.get(x.id) || 0));
      const legend = `<div class="legend">${tags.map((t, i) => `<span class="n${i}"><i></i>${esc(t)}</span>`).join('')}</div>`;
      return head + legend + `<div class="board">${cols.map((c, i) => `<div class="bcol"><h3>${esc(c)}</h3>${notes.filter((n) => n.col === i).map((n) => `<div class="stick n${n.tag}">${a.kind === 'dots' && votes.get(n.id) ? `<b>${'●'.repeat(Math.min(votes.get(n.id), 8))} ${votes.get(n.id)}</b>` : ''}${esc(n.text)}</div>`).join('')}</div>`).join('')}</div>`;
    }
    if (a.kind === 'team' && st.present && st.present.act === a.id) {
      const pr = st.present; const order = pr.order || [1, 2, 3];
      if (pr.i < 0) return `<div class="top"><div class="stack" style="gap:.3em;min-width:0"><div class="kick">${esc(a.title)}</div><h1 class="ttl">Who presents first?</h1></div></div><div class="wheel" data-at="${pr.at || ''}"><div class="disc"></div><ol>${order.map((id) => `<li class="${teamClass(id)}" style="color:var(--tc)">${esc(teamName(id))}</li>`).join('')}</ol></div>`;
      const tid = order[pr.i]; const ti = D.teams.findIndex((t) => t.id === tid); const t = D.teams[ti] || { id: tid, name: teamName(tid) };
      const o = a.options || {}; const fields = o.fields || []; const e = (D.entries || []).find((x) => x.team_id === tid); const d = (e && e.data) || {};
      return `<div class="top"><div class="stack" style="gap:.3em;min-width:0"><div class="kick">${esc(a.title)} · presentation ${pr.i + 1} of ${order.length}</div><h1 class="ttl ${teamClass(tid)}" style="color:var(--tc)">${esc(t.name)}</h1></div></div>
        <div class="tpage ${teamClass(tid)}">${(o.prompts || [])[ti] ? `<div class="pr">${esc(o.prompts[ti])}</div>` : ''}<div class="boxes">${(fields.length === 1 && (fields[0].tags || []).length) ? fields[0].tags.map((tag, gi) => { const v = (Array.isArray(d.f0) ? d.f0 : []).filter((it) => it.g === gi);
          return `<div class="bx"><h3>${esc(tag)}</h3>${v.length ? `<ul style="margin:0;padding-left:1.1em;white-space:normal">${v.map((it) => `<li>${esc(it.t)}</li>`).join('')}</ul>` : '<span class="muted">…</span>'}</div>`; }).join('') : fields.map((f, i) => { const v = d['f' + i]; const tg = f.tags || [];
          const body = f.type === 'text' ? (v ? esc(v) : '<span class="muted">…</span>') : ((Array.isArray(v) && v.length) ? `<ul style="margin:0;padding-left:1.1em;white-space:normal">${v.map((it) => `<li>${tg.length && tg[it.g] ? `<b>${esc(tg[it.g])}:</b> ` : ''}${esc(it.t)}</li>`).join('')}</ul>` : '<span class="muted">…</span>');
          return `<div class="bx"><h3>${esc(f.label)}</h3>${body}</div>`; }).join('')}</div></div>`;
    }
    if (a.kind === 'team') {
      const o = a.options || {}; const fields = o.fields || [];
      const status = (t) => { const e = (D.entries || []).find((x) => x.team_id === t.id); const d = (e && e.data) || {};
        const n = Object.values(d).reduce((k, v) => k + (Array.isArray(v) ? v.length : (v ? 1 : 0)), 0); return n ? `Writing… (${n} ${n === 1 ? 'entry' : 'entries'})` : 'Not started'; };
      return head + `<div class="teams3">${D.teams.map((t, ti) => `<div class="tsheet ${teamClass(t.id)}"><h3>${esc(t.name)}</h3>${(o.prompts || [])[ti] ? `<div class="pr">${esc(o.prompts[ti])}</div>` : ''}
          <div class="fl">On your phones</div><ul>${fields.map((f) => `<li>${esc(f.label)}${(f.tags || []).length ? ` <span class="muted">(${esc(f.tags.join(' / '))})</span>` : ''}</li>`).join('')}</ul>
          <div class="muted" style="margin-top:auto">${status(t)}</div></div>`).join('')}</div>`;
    }
    if (a.kind === 'allocate') {
      const o = a.options || {}; const items = (o.items && o.items.length) ? o.items : D.teams.map((t) => t.name);
      const tot = items.map((_, i) => R.reduce((s2, r) => s2 + (Number((r.value.alloc || [])[i]) || 0), 0));
      const top = Math.max(...tot, 0);
      const list = items.map((it, i) => ({ label: it + (st.phase !== 'open' && tot[i] === top && top > 0 ? '  · top' : ''), n: tot[i], cls: (o.items && o.items.length) ? '' : teamClass(D.teams[i] && D.teams[i].id) }));
      return head + bars(list, Math.max(1, ...tot));
    }
    if (a.kind === 'poll' || a.kind === 'quiz') {
      const counts = a.options.map((_, i) => R.filter((r) => r.value.choice === i).length);
      const reveal = a.kind === 'quiz' && st.phase === 'reveal';
      const hideCounts = a.kind === 'quiz' && !reveal;
      const items = a.options.map((o, i) => ({ k: LETTERS[i], label: o, n: hideCounts ? 0 : counts[i], cls: reveal ? (i === st.revealed_correct ? 'right' : 'dim') : '' }));
      let extra = '';
      if (reveal) {
        const fast = R.filter((r) => r.correct).sort((x, y) => x.elapsed_ms - y.elapsed_ms).slice(0, 5);
        extra = fast.length ? `<div class="lb">${fast.map((r, i) => `<div class="lb-row ${teamClass(r.team_id)}"><span class="rk">${i + 1}</span><span class="nm">${esc(playerName(r.participant_id))}</span><span class="pt">+${r.points}</span></div>`).join('')}</div>` : '<div class="empty">Nobody got this one.</div>';
      }
      if (hideCounts) return head + `<div class="bars">${a.options.map((o, i) => `<div class="bar"><div class="lab"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></div><div></div><div></div></div>`).join('')}</div>`;
      return head + `<div style="display:grid;grid-template-columns:${reveal ? 'minmax(0,1.3fr) minmax(0,1fr)' : 'minmax(0,1fr)'};gap:2em;flex:1;min-height:0;align-items:center">${bars(items, Math.max(...counts, 1))}${extra}</div>`;
    }
    if (a.kind === 'words') {
      const m = new Map();
      R.forEach((r) => (r.value.words || []).forEach((w) => { const k = w.trim().toLowerCase(); if (!k) return; const e = m.get(k) || { w: w.trim(), n: 0 }; e.n++; m.set(k, e); }));
      const list = [...m.values()].sort((x, y) => y.n - x.n).slice(0, 60);
      const max = Math.max(1, ...list.map((x) => x.n));
      return head + (list.length ? `<div class="cloud">${list.map((x, i) => `<span class="w${i % 5}" style="font-size:${(1 + 3.2 * (x.n / max)).toFixed(2)}em">${esc(x.w)}</span>`).join('')}</div>` : `<div class="empty"><b>Waiting for words</b>Type yours on your phone.</div>`);
    }
    if (a.kind === 'rating') {
      const scores = R.map((r) => r.value.score);
      const avg = scores.length ? scores.reduce((s, x) => s + x, 0) / scores.length : 0;
      const dist = [1, 2, 3, 4, 5].map((n) => ({ k: String(n), label: n === 1 ? (a.options[0] || '') : n === 5 ? (a.options[1] || '') : '', n: scores.filter((x) => x === n).length }));
      return head + `<div class="rating"><div class="stack" style="align-items:center;gap:0"><div class="avg">${scores.length ? avg.toFixed(1) : '–'}</div><div class="muted">average of ${scores.length}</div></div>${bars(dist, Math.max(1, ...dist.map((d) => d.n)))}</div>`;
    }
    const recent = [...R].sort((x, y) => new Date(y.created_at) - new Date(x.created_at)).slice(0, 24);
    return head + (recent.length ? `<div class="opens">${recent.map((r) => `<div>${esc(r.value.text)}</div>`).join('')}</div>` : `<div class="empty"><b>Waiting for answers</b>Type yours on your phone.</div>`);
  }

  function vLeaderboard() {
    const quizzes = D.acts.filter((x) => x.kind === 'quiz'); const lastQuiz = quizzes.length && quizzes[quizzes.length - 1].id === D.st.activity_id;
    const tot = new Map();
    const asked = new Set(D.resp.filter((r) => r.correct != null).map((r) => r.activity_id)).size;
    D.resp.forEach((r) => { const e = tot.get(r.participant_id) || { id: r.participant_id, pts: 0, ok: 0, team: r.team_id }; e.pts += r.points || 0; if (r.correct) e.ok++; tot.set(r.participant_id, e); });
    const list = [...tot.values()].filter((e) => e.pts > 0 || e.ok > 0).sort((a, b) => b.pts - a.pts).slice(0, 10);
    if (lastQuiz && list.length) {
      const top = list.slice(0, 3); const pl = (e, p) => e ? `<div class="place p${p} on ${teamClass(e.team)}"><div class="pn">${esc(playerName(e.id))}</div><div class="pp">${e.pts} pts · ${e.ok}/${asked}</div><div class="plinth">${p}</div></div>` : '<div></div>';
      const conf = Array.from({ length: 40 }, (_, i) => `<i style="left:${(i * 37) % 100}%;animation-delay:${(i % 10) * .18}s;background:${['#F2B705', '#0A6E78', '#C2410C', '#6D28D9', '#8FD18B'][i % 5]}"></i>`).join('');
      return `<div class="confetti">${conf}</div><div class="top"><div class="stack" style="gap:.3em"><div class="kick">Water Break · final</div><h1 class="ttl">${esc(playerName(top[0].id))} wins the quiz!</h1></div></div><div class="podium win">${pl(top[1], 2)}${pl(top[0], 1)}${pl(top[2], 3)}</div>`;
    }
    return `<div class="top"><div class="stack" style="gap:.3em"><div class="kick">Quiz</div><h1 class="ttl">Top players</h1></div></div>` +
      (list.length ? `<div class="lb">${list.map((e, i) => `<div class="lb-row ${teamClass(e.team)} ${i === 0 ? 'first' : ''}"><span class="rk">${i + 1}</span><span class="nm">${esc(playerName(e.id))} <span class="muted" style="font-size:.6em">${e.ok}/${asked} correct</span></span><span class="pt">${e.pts}</span></div>`).join('')}</div><div class="muted" style="font-size:.6em">Points: a right answer scores 500 to 1000, more when you answer faster.</div>` : `<div class="empty"><b>No points yet</b>Play a quiz question first.</div>`);
  }

  const totals = () => (D.board || []).map((t) => ({ ...t, total: t.manual + t.hunt + t.quiz }));
  function vTeams() {
    const T = totals(); const max = Math.max(1, ...T.map((t) => t.total)); const top = Math.max(...T.map((t) => t.total), 0);
    return `<div class="top"><div class="stack" style="gap:.3em"><div class="kick">Live standings</div><h1 class="ttl">Team scores</h1></div></div>
      <div class="bars">${T.map((t) => `<div class="bar ${teamClass(t.team_id)}"><div class="lab"><span class="team-dot"></span><span>${esc(t.name)}${t.total === top && top > 0 ? ' <span style="color:var(--good);font-size:.7em">Leading</span>' : ''}</span></div>
        <div class="track"><div class="fill" style="width:${Math.max(1.5, (Math.max(0, t.total) / max) * 100)}%"></div></div><div class="num">${t.total}</div></div>`).join('')}</div>
      <div class="muted" style="font-size:.7em">Games ${T.map((t) => `${esc(t.name)} ${t.manual}`).join(' · ')} — Hunt ${T.map((t) => t.hunt).join(' / ')} — Correct quiz answers ${T.map((t) => t.quiz).join(' / ')}</div>`;
  }

  function vPodium() {
    const T = totals().sort((a, b) => b.total - a.total || a.team_id - b.team_id); const step = D.st.podium_step || 0;
    const place = (p, t) => { const on = (p === 3 && step >= 1) || (p === 2 && step >= 2) || (p === 1 && step >= 3);
      return `<div class="place p${p} ${t ? teamClass(t.team_id) : ''} ${on ? 'on' : ''}"><div class="pn">${on && t ? esc(t.name) : '?'}</div><div class="pp">${on && t ? t.total + ' points' : '&nbsp;'}</div><div class="plinth">${p}</div></div>`; };
    return `<div class="top"><div class="stack" style="gap:.3em"><div class="kick">Awards</div><h1 class="ttl">${step >= 3 && T[0] ? esc(T[0].name) + ' wins the retreat' : 'And the winner is…'}</h1></div></div>
      <div class="podium">${place(2, T[1])}${place(1, T[0])}${place(3, T[2])}</div>`;
  }

  function vHunt() {
    const H = D.hunt || { length: 0, teams: [] };
    const conf = () => `<div class="confetti">${Array.from({ length: 40 }, (_, i) => `<i style="left:${(i * 37) % 100}%;animation-delay:${(i % 10) * .18}s;background:${['#F2B705', '#0A6E78', '#C2410C', '#6D28D9', '#8FD18B'][i % 5]}"></i>`).join('')}</div>`;
    if (D.race && D.race.word) {
      const w = D.race.word; const pat0 = String(H.pattern || '').split(',').map(Number).filter(Boolean); let p0 = 0;
      const tiles = (pat0.length ? pat0 : [w.length]).map((n) => { const g = w.slice(p0, p0 + n); p0 += n; return `<div class="tiles">${[...g].map((c) => `<span class="on" style="background:var(--accent);border-color:var(--accent)">${esc(c)}</span>`).join('')}</div>`; }).join('');
      const R = (D.race.teams || []).map((r) => ({ ...r, total: r.questions + (r.bonus || 0) + (r.guess || 0) + r.helps + r.crack })).sort((a, b) => b.total - a.total);
      const best = R[0];
      return `${conf()}<div class="top"><div class="stack" style="gap:.3em"><div class="kick">Message in a bottle · the result</div><h1 class="ttl">${best ? esc(teamName(best.team_id)) + ' win the word race!' : 'The message'}</h1></div></div>
        <div style="display:flex;flex-wrap:wrap;gap:.6em 1.4em">${tiles}</div>
        <div class="lb">${R.map((r, i) => `<div class="lb-row ${teamClass(r.team_id)} ${i === 0 ? 'first' : ''}"><span class="rk">${i + 1}</span><span class="nm">${esc(teamName(r.team_id))} <span class="muted" style="font-size:.55em">opened letters ${r.questions} + unopened ${r.bonus || 0} + guess ${r.guess || 0} + cracking ${r.crack}${r.helps ? ' ' + r.helps + ' helps' : ''}</span></span><span class="pt">${r.total}</span></div>`).join('')}</div>
        <div class="muted" style="font-size:.62em">How it scores: each opened letter 3 / 2 / 1 / 0 (question right on the 1st / 2nd / 3rd try / locked) · each letter not opened when you crack it 4 · the message 3 / 2 / 1 (right on the 1st / 2nd / 3rd guess) · first team to crack it +10, later +5 · each help −1.</div>`;
    }
    const pat = String(H.pattern || '').split(',').map(Number).filter(Boolean); const groups = pat.length ? pat : [H.length];
    const winner = H.winner ? D.teams.find((t) => t.id === H.winner) : null;
    const blanks = groups.map((len) => `<div class="tiles">${Array.from({ length: len }, () => '<span></span>').join('')}</div>`).join('');
    return `${winner ? conf() : ''}<div class="top"><div class="stack" style="gap:.3em"><div class="kick">Message in a bottle · ${H.length} letters${winner ? ' · keep going: the other teams can still crack it' : ''}</div><div class="muted" style="font-size:.6em">Opened letter 3/2/1/0 · letter not opened when you crack it 4 · message guess 3/2/1 · first to crack +10, later +5 · help −1</div><h1 class="ttl">${winner ? esc(winner.name) + ' cracked it first!' : 'Crack the message in the bottle'}</h1></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:.6em 1.4em">${blanks}</div>
      <div class="hunt">${D.teams.map((t) => { const h = (H.teams || []).find((x) => x.team_id === t.id) || { cards: 0, opened: 0, placed: 0, guesses: 0 }; const solved = (H.solved_teams || []).includes(t.id);
        return `<div class="${teamClass(t.id)}"><div class="hunt-head"><b><span class="team-dot"></span>${esc(t.name)}</b><span class="muted">${h.opened} of ${h.cards} letters opened · ${h.placed} of ${H.length} boxes filled · ${h.guesses} of 5 guesses${solved ? ' · solved' : ''}</span></div>
        <div class="tiles">${Array.from({ length: H.length }, (_, i) => `<span class="${i < h.placed ? 'on' : ''}">${i < h.placed ? '•' : ''}</span>`).join('')}</div></div>`; }).join('')}</div>`;
  }

  function paint() {
    const v = ({ lobby: vLobby, activity: vActivity, leaderboard: vLeaderboard, teams: vTeams, podium: vPodium, hunt: vHunt, session: vSession })[D.st.screen] || vLobby;
    const html = `<div class="main">${v()}</div>${D.st.screen === 'lobby' ? '' : foot()}`;
    if (html !== lastHtml) { scr.innerHTML = html; lastHtml = html; }
    tick();
  }

  function tick() {
    const el = scr.querySelector('[data-timer]'); if (!el) return;
    const a = D.acts.find((x) => x.id === D.st.activity_id); if (!a || !D.st.opened_at) return;
    const left = Math.max(0, a.time_limit - (now() - new Date(D.st.opened_at).getTime()) / 1000);
    el.textContent = left > 0 ? Math.ceil(left) + ' s' : "Time's up";
    el.classList.toggle('low', left <= 5);
  }

  // Presenter keys: on a laptop where the host has signed in, arrows move through the steps.
  const hint = document.createElement('div');
  hint.style.cssText = 'position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);opacity:.6';
  hint.textContent = WR.getPin() ? '← → to move' : 'To move with the arrow keys, sign in at /host on this laptop'; document.body.appendChild(hint);
  let moving = false;
  async function move(dir) {
    const pin = WR.getPin(); if (!pin || moving) return;
    moving = true;
    try {
      const steps = WR.flow.build(D.acts); const i = WR.flow.indexOf(steps, D.st); const j = i + dir;
      if (j >= 0 && j < steps.length) { await rpc('host_set_state', { p_pin: pin, p_patch: dir > 0 ? WR.flow.patch(steps[j], D.st) : WR.flow.patchBack(steps[j], D.st) }); await refresh(); }
    } catch (e) { hint.textContent = /passphrase/i.test(e.message) ? 'Sign in on /host first' : e.message; }
    moving = false;
  }
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); move(1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); move(-1); }
  });

  syncClock();
  setInterval(tick, 250);
  setTimeout(() => live(['state', 'responses', 'participants', 'activities', 'teams', 'team_points', 'notes', 'note_votes', 'team_entries', 'race_board', 'hunt_guesses'], refresh, 4000), 300);
  document.addEventListener('dblclick', () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} });
})();
</script>
</body>
</html>
