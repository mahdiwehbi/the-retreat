<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WAP Card · WASH Retreat</title>
<meta name="theme-color" content="#0A6E78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .pick{display:flex;flex-direction:column;gap:8px}
  .pick button{text-align:left;min-height:56px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600}
  .pick button small{display:block;font-weight:400;color:var(--muted)}
  .desc{font-size:19px;line-height:1.45}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><section class="card"><p class="muted">Loading…</p></section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/lib.js"></script>
<script>
(function () {
  const { $, esc, rpc, rows } = WR;
  const app = $('#app');
  if (!WR.configured) { WR.setupNotice(app); return; }
  const code = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
  async function start() {
    if (await WR.closedGuard(app)) return;
    if (!code) { app.innerHTML = '<section class="card"><p class="muted" style="margin:0">Scan a helper card to see what it is.</p></section>'; return; }
    const [spot] = await rows('hunt_spots', (q) => q.eq('code', code));
    if (!spot) { app.innerHTML = `<section class="card"><h1 style="font-size:24px">Card not found</h1><p class="muted" style="margin:0">${esc(code)} is not a helper card.</p></section>`; return; }
    let info = null, err = '';
    try { info = await rpc('spot_info', { p_code: code }); } catch (e) { err = e.message; }
    app.innerHTML = `<header class="spread"><span class="eyebrow">Helper card ${esc(spot.code)} · ${esc(spot.grp)}</span></header>
      <section class="card"><h1 style="font-size:22px;margin:0">${esc(spot.title)}</h1><p class="desc" style="margin:0">${esc(spot.description)}</p></section>
      ${info ? `<section class="card" style="border-color:var(--accent)"><div class="eyebrow">In WAP, this is</div><div class="big-msg" style="font-size:30px">${esc(info.name)}</div><p style="margin:0">${esc(info.explain)}</p></section>` : `<p class="notice">${esc(err)}</p>`}
      <nav class="foot-links"><a href="/sap">Back to the site test</a><a href="/">Back to the game</a></nav>`;
  }
  start();
})();
</script>
</body>
</html>
