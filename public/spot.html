<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WAP Card · WASH Retreat</title>
<meta name="theme-color" content="#0A6E78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .pick{display:flex;flex-direction:column;gap:8px}
  .pick button{text-align:left;min-height:56px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600}
  .pick button small{display:block;font-weight:400;color:var(--muted)}
  .desc{font-size:19px;line-height:1.45}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><section class="card"><p class="muted">Loading…</p></section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/lib.js"></script>
<script>
(function () {
  const { $, esc, teamClass, rpc, rows, toast } = WR;
  const app = $('#app');
  if (!WR.configured) { WR.setupNotice(app); return; }
  const code = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
  let me = null, spot = null, clues = [], mine = [];

  async function start() {
    if (!code) return manual();
    try { me = await WR.checkMe(); } catch (e) { me = WR.getMe(); }
    if (!me) return WR.renderJoin(app, (m) => { me = m; load(); });
    load();
  }
  function manual() {
    app.innerHTML = `<section class="card"><div class="eyebrow">Treasure hunt</div><h1 style="font-size:26px">Type the code on the card</h1>
      <form id="mf" class="stack"><input id="mcode" maxlength="10" autocapitalize="characters" autocomplete="off" aria-label="Card code" placeholder="e.g. A5 or R03"><button class="btn primary block">Open</button></form></section>`;
    $('#mf').addEventListener('submit', async (e) => {
      e.preventDefault(); const v = $('#mcode').value.trim().toUpperCase(); if (!v) return;
      const s = await rows('hunt_spots', (q) => q.eq('code', v));
      location.href = (s.length ? '/spot?c=' : '/card?c=') + encodeURIComponent(v);
    });
  }

  async function load() {
    [spot] = await rows('hunt_spots', (q) => q.eq('code', code));
    if (!spot) { location.replace('/card?c=' + encodeURIComponent(code)); return; }
    clues = (await rows('hunt_cards', (q) => q.eq('kind', 'find').order('position'))) || [];
    try { mine = await rpc('hunt_my_team', { p_pid: me.id, p_token: me.token }); } catch (e) { if (/join again/i.test(e.message)) { WR.setMe(null); location.reload(); return; } }
    render();
  }

  function render(msg) {
    const by = new Map(mine.map((x) => [x.id, x]));
    const open = clues.filter((c) => { const m = by.get(c.id) || {}; return !m.solved && (m.wrong || 0) < 3; });
    app.innerHTML = `
      <header class="spread"><span class="eyebrow">${esc(spot.grp)} · card ${esc(spot.code)}</span><span class="chip ${teamClass(me.team_id)}"><span class="team-dot"></span>Your team</span></header>
      <section class="card"><h1 style="font-size:24px">${esc(spot.title)}</h1><p class="desc" style="margin:0">${esc(spot.description)}</p></section>
      ${msg || ''}
      <section class="card"><strong>Does this card answer one of your clues?</strong>
        ${open.length ? `<div class="pick">${open.map((c) => { const m = by.get(c.id) || {}; return `<button data-clue="${esc(c.code)}">${esc(c.prompt.replace(/^WAP explorer: /, ''))}<small>${3 - (m.wrong || 0)} ${3 - (m.wrong || 0) === 1 ? 'try' : 'tries'} left · ${c.points} pts</small></button>`; }).join('')}</div>`
          : '<p class="muted" style="margin:0">Your team has no open clues left. Well done!</p>'}
        <p class="muted small" style="margin:0">Not sure? Leave it and look for other cards. A wrong answer uses a try.</p></section>
      <nav class="foot-links"><a href="/hunt">All clues</a><a href="/">Back to the game</a></nav>`;
  }

  app.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-clue]'); if (!b || b.disabled) return;
    app.querySelectorAll('[data-clue]').forEach((x) => (x.disabled = true));
    try {
      const res = await rpc('hunt_submit', { p_pid: me.id, p_token: me.token, p_code: b.dataset.clue, p_answer: spot.code, p_photo: null });
      mine = await rpc('hunt_my_team', { p_pid: me.id, p_token: me.token });
      const why = res.explain ? `<p style="margin:0"><strong>${esc(spot.code)} is: ${esc(res.name)}.</strong> ${esc(res.explain)}</p>` : '';
      if (res.status === 'correct') render(`<section class="card"><div class="big-msg" style="text-align:center">Right! +${res.points}</div>${why}</section>`);
      else if (res.status === 'already') render('<p class="notice">Your team already solved that clue.</p>');
      else if (res.status === 'locked') render('<p class="notice bad">That clue is locked: 3 tries used.</p>');
      else render(`<section class="card"><p class="notice bad" style="margin:0"><strong>Not this card.</strong> ${res.left > 0 ? `${res.left} ${res.left === 1 ? 'try' : 'tries'} left on that clue.` : 'That clue is now locked.'}</p>${why}</section>`);
    } catch (ex) { toast(ex.message, 4000); render(); }
  });

  start();
})();
</script>
</body>
</html>
