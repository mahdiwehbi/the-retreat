<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hunt Card · WASH Retreat</title>
<meta name="theme-color" content="#0A6E78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><section class="card"><p class="muted">Loading…</p></section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/lib.js"></script>
<script>
(function () {
  const { $, esc, LETTERS, teamClass, rpc, rows, toast } = WR;
  const app = $('#app');
  if (!WR.configured) { WR.setupNotice(app); return; }
  const code = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
  let fresh = false, mineCards = [], cur = null, me = null, live = null, card = null, teams = [], photoFile = null, pick = null;

  async function start() {
    if (!code) return manual();
    try { me = await WR.checkMe(); } catch (e) { me = WR.getMe(); }
    if (!me) {
      // A name badge joins its owner straight into the team printed on it.
      try {
        const [b] = await rows('hunt_cards', (q) => q.ilike('code', code));
        if (b && b.holder && b.team_id) return confirmBadge(b);
      } catch (e) { app.innerHTML = `<section class="card" style="text-align:center"><div class="big-msg">Welcome!</div><p class="notice" style="margin:0">${esc(e.message)}</p></section>`; return; }
    }
    if (!me) return WR.renderJoin(app, (m) => { me = m; load(); });
    load();
  }

  // Nothing is saved until the person confirms the badge is theirs.
  async function confirmBadge(b) {
    let tn = '';
    try { teams = await rows('teams', (q) => q.order('id')); const t = teams.find((x) => x.id === b.team_id); tn = t ? t.name : ''; } catch (e) {}
    app.innerHTML = `<section class="card ${teamClass(b.team_id)}" style="text-align:center"><div class="eyebrow">WASH Coordination Team Retreat</div>
      <p style="margin:0">This is the badge of</p><div class="big-msg">${esc(b.holder)}</div>${tn ? `<p style="margin:0"><span class="chip ${teamClass(b.team_id)}"><span class="team-dot"></span>${esc(tn)}</span></p>` : ''}
      <p style="margin:0;font-weight:700">Is this you?</p>
      <button class="btn primary block" data-act="yes">Yes, confirm my attendance</button>
      <button class="btn block" data-act="no">Not me</button></section>`;
    app.querySelector('[data-act="yes"]').addEventListener('click', async (e) => {
      e.target.disabled = true;
      try { me = await rpc('badge_checkin', { p_code: b.code }); WR.setMe(me); fresh = true; load(); }
      catch (err) { e.target.disabled = false; toast(err.message, 4000); }
    });
    app.querySelector('[data-act="no"]').addEventListener('click', () => {
      app.innerHTML = `<section class="card" style="text-align:center"><div class="big-msg">No problem</div><p style="margin:0">Nothing was saved. Give this badge back to <strong>${esc(b.holder)}</strong> and scan your own badge.</p></section>`;
    });
  }

  function manual() {
    app.innerHTML = `<section class="card"><div class="eyebrow">Treasure hunt</div><h1 style="font-size:26px">Type the card code</h1>
      <form id="mf" class="stack"><input id="mcode" maxlength="10" autocapitalize="characters" autocomplete="off" aria-label="Card code" placeholder="e.g. 4F2A9">
      <button class="btn primary block">Open card</button></form><p class="muted small" style="margin:0">The code is printed on the card under the QR code.</p></section>`;
    $('#mf').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#mcode').value.trim(); if (v) location.href = '/card?c=' + encodeURIComponent(v); });
  }

  async function load() {
    try {
      [card] = await rows('hunt_cards', (q) => q.ilike('code', code));
      teams = await rows('teams', (q) => q.order('id'));
      [live] = await rows('state');
    } catch (e) { app.innerHTML = `<section class="card"><p class="notice bad">${esc(e.message)}</p></section>`; return; }
    if (WR.isLive(live, 'closed')) { WR.thanks(app); return; }
    if (!card) { app.innerHTML = `<section class="card"><h1 style="font-size:24px">Card not found</h1><p class="muted">The code ${esc(code)} is not part of this game. Check the code on the card.</p><a class="btn" href="/card">Type a code</a></section>`; return; }
    // Letter questions belong to one person: someone else scanning it only sees whose it is.
    const nm = (x) => String(x || '').trim().toLowerCase();
    if (card.letter_index != null && card.holder && nm(me.name) !== nm(card.holder)) {
      const first = esc(String(card.holder).split(' ')[0]);
      app.innerHTML = `<section class="card ${teamClass(card.team_id || me.team_id)}" style="text-align:center"><div class="eyebrow">Treasure hunt</div><div class="big-msg">This is ${first}'s</div>
        <p style="margin:0">This ${card.grp === 'rooms' ? 'room card' : 'badge'} belongs to <strong>${esc(card.holder)}</strong>. Its question is for ${first} only: give it back and scan your own.</p>
        <p class="muted small" style="margin:0">This phone is in the game as ${esc(me.name)}.</p>
        ${card.grp === 'badges' ? `<button class="btn block" data-act="iam">I am ${esc(card.holder)}: use my badge on this phone</button>` : ''}
        <a class="btn primary block" href="/">Back to the game</a></section>`;
      const ib = app.querySelector('[data-act="iam"]');
      if (ib) ib.addEventListener('click', async () => { try { me = await rpc('badge_checkin', { p_code: card.code }); WR.setMe(me); fresh = true; load(); } catch (e) { toast(e.message, 4000); } });
      return;
    }
    // First scan of a badge = check-in: always show the welcome first.
    if (fresh && card.grp === 'badges') return welcome();
    // Letter questions: where is this person? Badge → question 1, then question 2 (B card) if they have no room card.
    if (card.letter_index != null && WR.isLive(live, card.grp)) {
      try { mineCards = await rpc('hunt_my_team', { p_pid: me.id, p_token: me.token }); } catch (e) { mineCards = []; }
      const st = (c) => { const m = mineCards.find((x) => x.code === c.code) || {}; return { done: m.solved || (m.wrong || 0) >= 3, wrong: m.wrong || 0, solved: !!m.solved }; };
      cur = st(card);
      if (cur.done && card.grp === 'badges' && /^R/.test(card.code)) {
        const [b2] = await rows('hunt_cards', (q) => q.eq('code', 'B' + card.code.slice(1)));
        if (b2 && !st(b2).done) { location.replace('/card?c=' + b2.code); return; }
        if (me.name === card.holder) { location.replace(WR.isLive(live, 'race') ? '/hunt' : '/'); return; }
      }
      if (cur.done) { try { const L = await rpc('race_my_letters', { p_pid: me.id, p_token: me.token }); const x = L.find((y) => y.code === card.code); return done({ status: cur.solved ? 'already' : 'locked', letter: x && x.letter }); } catch (e) {} }
    }
    if (card.grp === 'golden') { render(); return; }
    if (card.grp && !WR.isLive(live, card.grp)) {
      // Badge scanned again by its owner: go to whatever the current session is.
      if (card.grp === 'badges' && !fresh && me.name === card.holder) { location.replace('/'); return; }
      if (card.grp === 'badges') return welcome();
      app.innerHTML = `<section class="card" style="text-align:center"><div class="eyebrow">Not open yet</div><div class="big-msg">${card.grp === 'rooms' ? 'Welcome!' : 'Patience…'}</div>
        <p style="margin:0">${card.grp === 'rooms' ? 'Your room bonus opens at check-in. Scan it again then.' : card.grp === 'lake' ? 'This clue opens at the lake.' : 'This opens later in the retreat.'}</p><a class="btn primary block" href="/">Open the game</a></section>`;
      return;
    }
    render();
  }

  function welcome() {
    const t = teamClass(card.team_id || me.team_id);
    const other = card.team_id && card.team_id !== me.team_id;
    app.innerHTML = `<section class="card ${t}" style="text-align:center"><div class="eyebrow">WASH Coordination Team Retreat</div>
      <div class="big-msg">Welcome, ${esc(me.name.split(' ')[0])}!</div>
      <p style="margin:0">You are checked in${other ? '' : ` with <strong>${esc(teamName())}</strong>`}.</p>
      ${other || (card.holder && me.name !== card.holder) ? `<p class="notice bad" style="margin:0">This badge is ${esc(card.holder || 'someone else')}'s. This phone is in the game as ${esc(me.name)}.</p><button class="btn block" data-act="iam">I am ${esc(card.holder)}: use my badge on this phone</button>` : ''}
      <p class="muted small" style="margin:0">Keep your badge with you all day.</p>
      <a class="btn primary block" href="/">Open the game</a></section>`;
    // After the welcome: the badge question if it is open (Safe Harbour onward), else the current session.
    if (fresh && !other) setTimeout(() => location.replace(card.letter_index != null && WR.isLive(live, card.grp) ? '/card?c=' + encodeURIComponent(card.code) : '/'), 3500);
    const b = app.querySelector('[data-act="iam"]');
    if (b) b.addEventListener('click', async () => { try { me = await rpc('badge_checkin', { p_code: card.code }); WR.setMe(me); load(); } catch (e) { toast(e.message, 4000); } });
  }

  // The golden card has one line per team ("Herons: …"); each team only sees its own.
  function promptFor(c) {
    if (c.grp !== 'golden') return c.prompt;
    const ls = String(c.prompt || '').split('\n'); const nm = teamName().toLowerCase();
    const mine = ls.find((l) => l.toLowerCase().startsWith(nm + ':'));
    return mine ? ls[0] + '\n' + mine.slice(mine.indexOf(':') + 1).trim() : ls[0];
  }
  function teamName() { const t = teams.find((x) => x.id === me.team_id); return t ? t.name : 'your team'; }

  function render(resultHtml) {
    const k = card.kind;
    if (k === 'find') {
      app.innerHTML = `<section class="card"><div class="eyebrow">WAP explorer</div><h1 style="font-size:24px">${esc(card.prompt)}</h1><p class="muted" style="margin:0">Find the card that matches around the lake and scan it. Its page lets you send it as your answer.</p><a class="btn primary block" href="/hunt">See all clues</a></section>`;
      return;
    }
    let form = '';
    if (k === 'quiz') {
      form = `<div class="answers">${(card.options || []).map((o, i) => `<button type="button" class="ans" data-pick="${i}" aria-pressed="${pick === i}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    } else if (k === 'photo') {
      form = `<label class="btn block" for="photo">${photoFile ? 'Retake photo' : 'Take a photo'}</label>
        <input id="photo" type="file" accept="image/*" capture="environment" hidden>
        <img id="prev" class="photo-prev" alt="Your photo" ${photoFile ? '' : 'hidden'}>
        <label class="field" for="note">Caption (optional)<input id="note" maxlength="200" placeholder="What does it show?"></label>`;
    } else {
      form = `<label class="field" for="answer">Your team's answer<input id="answer" maxlength="200" autocomplete="off" placeholder="Type the answer"></label>`;
    }
    app.innerHTML = `
      <header class="spread"><span class="eyebrow">Treasure hunt · card ${esc(card.code)}</span><span class="chip ${teamClass(me.team_id)}"><span class="team-dot"></span>${esc(teamName())}</span></header>
      <section class="card">
        ${card.golden ? '<div class="chip" style="align-self:flex-start;color:var(--gold);border-color:var(--gold)">Golden card · double points</div>' : ''}
        <h1 style="font-size:24px;white-space:pre-line">${esc(promptFor(card))}</h1>
        ${card.holder ? `<p class="small muted" style="margin:0">Card for <strong>${esc(card.holder)}</strong></p>` : ''}
        ${card.team_id && card.team_id !== me.team_id ? `<p class="notice bad" style="margin:0">This card belongs to another team. Give it back to ${esc(card.holder || 'its owner')}.</p>` : ''}
        ${resultHtml || ''}
        <form id="cf" class="stack">${form}<button class="btn primary block" type="submit">Submit for ${esc(teamName())}</button></form>
        <p class="muted small" style="margin:0">${card.letter_index != null ? `3 tries. This question opens 1 letter of the secret message: 3 points on the first try, then 2, then 1. After 3 wrong tries you still get the letter, with 0 points.${cur && cur.wrong ? ` <strong>${3 - cur.wrong} ${3 - cur.wrong === 1 ? 'try' : 'tries'} left.</strong>` : ''}` : card.grp === 'golden' ? 'Opens when your team has sent the site form and its 3 tents.' : 'Your team has 3 tries per card.'}</p>
      </section>
      <nav class="foot-links"><a href="/hunt">Your letters</a><a href="/">Back to the game</a></nav>`;
    if (photoFile) { const r = new FileReader(); r.onload = () => { const p = $('#prev'); if (p) { p.src = r.result; p.hidden = false; } }; r.readAsDataURL(photoFile); }
  }

  function done(res) {
    const t = teamClass(me.team_id);
    const tile = res.letter ? `<div class="${t}" style="display:flex;justify-content:center"><div class="letter-tile">${esc(res.letter)}</div></div><p style="text-align:center;margin:0">Your letter. Keep it secret until the word race after lunch.</p>` : '';
    const next = card.grp === 'badges' && /^R/.test(card.code) ? `<a class="btn primary block" href="/card?c=${encodeURIComponent(card.code)}">Continue</a>` : `<a class="btn primary block" href="/hunt">See your letters</a>`;
    if (res.status === 'correct' || res.status === 'already') {
      app.innerHTML = `<section class="card" style="text-align:center"><div class="big-msg">${res.status === 'correct' ? 'Right!' : 'Already answered'}</div>
        <p class="muted" style="margin:0">${res.status === 'correct' && res.points ? `${esc(teamName())} gets ${res.points} point${res.points === 1 ? '' : 's'}.` : ''}</p>${tile}${card.letter_index != null ? next : '<a class="btn primary block" href="/">Back to the game</a>'}</section>`;
      return;
    }
    if (res.status === 'locked') {
      app.innerHTML = `<section class="card" style="text-align:center"><div class="big-msg">3 tries used</div><p class="muted" style="margin:0">No points for this one, but here is your letter.</p>${tile}${card.letter_index != null ? next : '<a class="btn primary block" href="/">Back to the game</a>'}</section>`;
      return;
    }
    cur = { done: false, wrong: 3 - (res.left || 0), solved: false };
    render(`<p class="notice bad">Not quite. ${res.left > 0 ? `${res.left} ${res.left === 1 ? 'try' : 'tries'} left.` : ''}</p>`);
  }

  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    pick = Number(b.dataset.pick);
    app.querySelectorAll('[data-pick]').forEach((x) => x.setAttribute('aria-pressed', String(Number(x.dataset.pick) === pick)));
  });
  app.addEventListener('change', (e) => {
    if (e.target.id === 'photo' && e.target.files[0]) { photoFile = e.target.files[0]; render(); }
  });
  app.addEventListener('submit', async (e) => {
    if (e.target.id !== 'cf') return;
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    let answer = '', photo = null;
    if (card.kind === 'quiz') { if (pick == null) return toast('Pick an answer first.'); answer = String(pick); }
    else if (card.kind === 'photo') { if (!photoFile) return toast('Take a photo first.'); answer = ($('#note') || {}).value || ''; }
    else { answer = ($('#answer').value || '').trim(); if (!answer) return toast('Type an answer first.'); }
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      if (photoFile) photo = await WR.uploadPhoto(photoFile, 'hunt');
      const res = await rpc('hunt_submit', { p_pid: me.id, p_token: me.token, p_code: card.code, p_answer: answer, p_photo: photo });
      done(res);
    } catch (ex) {
      if (/join again/i.test(ex.message)) { WR.setMe(null); location.reload(); return; }
      toast(ex.message, 4000); btn.disabled = false; btn.textContent = 'Try again';
    }
  });

  start();
})();
</script>
</body>
</html>
