<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treasure Hunt · WASH Retreat</title>
<meta name="theme-color" content="#0A6E78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .tiles{display:flex;flex-wrap:wrap;gap:6px}
  .tiles span{width:34px;height:42px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;font-family:var(--display);font-weight:800;font-size:22px}
  .tiles span.on{background:var(--tc);border-color:var(--tc);color:var(--on-team)}
  .clue{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
  .clue .st{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--muted);font-family:var(--display)}
  .clue.done{opacity:.65}
  .clue.done .st{background:var(--good);color:var(--surface)}
  .clue.gold{border-color:var(--gold)}
  .clue p{margin:0}
  .how{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><section class="card"><p class="muted">Loading…</p></section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/lib.js"></script>
<script>
(function () {
  const { $, esc, teamClass, rpc, rows, live } = WR;
  const app = $('#app');
  if (!WR.configured) { WR.setupNotice(app); return; }
  let me = null, cards = [], mine = [], teams = [], secretLen = 0;

  async function start() {
    try { me = await WR.checkMe(); } catch (e) { me = WR.getMe(); }
    if (!me) return WR.renderJoin(app, (m) => { me = m; go(); });
    go();
  }
  function go() { live(['hunt_cards', 'teams'], refresh, 5000); }

  async function refresh() {
    const [c, t, b] = await Promise.all([rows('hunt_cards', (q) => q.order('position').order('code')), rows('teams', (q) => q.order('id')), rpc('hunt_board')]);
    cards = c; teams = t; secretLen = b.length || 0;
    try { mine = await rpc('hunt_my_team', { p_pid: me.id, p_token: me.token }); } catch (e) { if (/join again/i.test(e.message)) { WR.setMe(null); location.reload(); } }
    render();
  }

  function render() {
    const byId = new Map(mine.map((x) => [x.id, x]));
    const letters = new Map(); cards.forEach((c) => { const m = byId.get(c.id); if (m && m.letter && c.letter_index != null) letters.set(c.letter_index, m.letter); });
    const solved = mine.filter((x) => x.solved).length;
    const team = teams.find((t) => t.id === me.team_id) || { name: 'Your team' };
    const how = { find: 'Find the matching card around the lake and scan its QR code.', text: 'Tap to answer.', quiz: 'Tap to answer.', photo: 'Tap to send a photo.' };
    app.innerHTML = `
      <header class="spread"><span class="eyebrow">Treasure hunt</span><span class="chip ${teamClass(me.team_id)}"><span class="team-dot"></span>${esc(team.name)}</span></header>
      <section class="card ${teamClass(me.team_id)}"><h1 style="font-size:26px">The secret word</h1>
        <div class="tiles">${Array.from({ length: secretLen }, (_, i) => `<span class="${letters.has(i) ? 'on' : ''}">${letters.has(i) ? esc(letters.get(i)) : ''}</span>`).join('')}</div>
        <p class="muted small" style="margin:0">${solved} of ${cards.length} clues solved. Every room card unlocks one letter. Your team has 3 tries per card.</p></section>
      ${(() => {
        const rooms = cards.filter((c) => /^R\d/.test(c.code)); const lake = cards.filter((c) => !/^R\d/.test(c.code));
        const roomsHtml = rooms.length ? `<section class="card"><strong>Day 1 · Hotel rooms</strong><p class="small" style="margin:0">A card with a QR code hangs on every room door. Scan it, answer as a team, and win that room's letter.</p>
          <div class="tiles">${rooms.map((c) => { const m = byId.get(c.id) || {}; return `<span class="${m.solved ? 'on' : ''}" title="${esc(c.code)}" style="${!m.solved && m.wrong >= 3 ? 'opacity:.4' : ''}">${m.solved ? esc(m.letter || '✓') : '·'}</span>`; }).join('')}</div>
          <span class="how">${rooms.filter((c) => (byId.get(c.id) || {}).solved).length} of ${rooms.length} rooms done</span></section>` : '';
        const lakeHtml = lake.length ? `<section class="card"><strong>Day 2 · WAP explorer at the lake</strong><p class="small" style="margin:0">Cards around the lake describe latrines, water sources and wastewater disposal. Only some match a clue. Read, use the WAP definitions, then scan. A wrong scan uses one of your 3 tries.</p></section>
          <div class="stack">${lake.map((c, i) => { const m = byId.get(c.id) || {}; const done = m.solved; const locked = !done && m.wrong >= 3;
            const inner = `<span class="st">${done ? '✓' : i + 1}</span><span class="stack" style="gap:4px"><p><strong>${esc(c.prompt)}</strong></p><span class="how">${done ? 'Solved' : locked ? 'Locked: 3 tries used' : how[c.kind] || ''}${!done && !locked && m.wrong ? ` · ${3 - m.wrong} ${3 - m.wrong === 1 ? 'try' : 'tries'} left` : ''} · ${c.points} pt${c.points === 1 ? '' : 's'}</span></span>`;
            return c.kind === 'find' || done || locked ? `<div class="clue ${done ? 'done' : ''} ${c.golden ? 'gold' : ''}">${inner}</div>` : `<a class="clue ${c.golden ? 'gold' : ''}" href="/card?c=${encodeURIComponent(c.code)}">${inner}</a>`; }).join('')}</div>` : '';
        return roomsHtml + lakeHtml;
      })()}
      <nav class="foot-links"><a href="/">Back to the game</a><a href="/spot">Type a card code</a></nav>`;
  }
  start();
})();
</script>
</body>
</html>
