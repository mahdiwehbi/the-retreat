<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treasure Hunt · WASH Retreat</title>
<meta name="theme-color" content="#0A6E78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .word{display:flex;flex-wrap:wrap;gap:6px 14px}
  .word .grp{display:flex;gap:5px}
  .slot{width:36px;height:46px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:8px;font-family:var(--display);font-weight:800;font-size:22px;background:var(--surface);color:var(--ink);padding:0;cursor:pointer}
  .slot.full{border-style:solid;border-color:var(--tc);background:var(--tc);color:var(--on-team)}
  .slot.lock{box-shadow:inset 0 0 0 3px #FFE07A}
  .slot.target{border-color:var(--accent);border-style:solid}
  .tray{display:flex;flex-wrap:wrap;gap:8px}
  .tile{width:48px;height:58px;display:grid;place-items:center;border-radius:10px;font-family:var(--display);font-weight:800;font-size:28px;border:2px solid var(--tc);background:var(--surface);color:var(--ink);cursor:grab;padding:0}
  .tile[aria-pressed="true"]{background:var(--tc);color:var(--on-team)}
  .tile.used{opacity:.35}
  .q{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
  .how{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><section class="card"><p class="muted">Loading…</p></section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/lib.js"></script>
<script>
(function () {
  const { $, esc, teamClass, rpc, rows, live, toast } = WR;
  const app = $('#app');
  if (!WR.configured) { WR.setupNotice(app); return; }
  let pendingRender = false, guessText = '', me = null, st = null, teams = [], board = {}, myLetters = [], slots = [], myQs = [], solvedWord = null, pick = null, busy = false;

  async function start() {
    try { me = await WR.checkMe(); } catch (e) { me = WR.getMe(); }
    if (!me) return WR.renderJoin(app, (m) => { me = m; go(); });
    go();
  }
  function go() { live(['state', 'teams', 'race_board', 'hunt_guesses', 'hunt_finds'], refresh, 4000); }

  async function refresh() {
    const [s, t] = await Promise.all([rows('state'), rows('teams', (q) => q.order('id'))]);
    st = s[0] || {}; teams = t;
    if (WR.isLive(st, 'closed')) { WR.thanks(app); return; }
    try {
      const [b, L, sl, qs] = await Promise.all([rpc('hunt_board'), rpc('race_my_letters', { p_pid: me.id, p_token: me.token }), rows('race_board', (q) => q.eq('team_id', me.team_id)),
        rows('hunt_cards', (q) => q.not('letter_index', 'is', null).eq('team_id', me.team_id).eq('holder', me.name))]);
      board = b; myLetters = L; slots = sl; myQs = qs;
      try { solvedWord = await rpc('hunt_reveal', { p_pid: me.id, p_token: me.token }); } catch (e) {}
    } catch (e) { if (/join again/i.test(e.message)) { WR.setMe(null); location.reload(); return; } toast(e.message, 4000); }
    const ae = document.activeElement;
    if (ae && ae.id === 'guess') { pendingRender = true; return; } // don't wipe what someone is typing
    if (!busy) render();
  }

  function render() {
    const team = teams.find((t) => t.id === me.team_id) || { name: 'Your team' };
    const raceOn = WR.isLive(st, 'race');
    const len = board.length || 0; const pat = String(board.pattern || '').split(',').map(Number).filter(Boolean); const groups = pat.length ? pat : [len];
    const bySlot = new Map(slots.map((x) => [x.slot, x]));
    const onBoard = new Set(slots.map((x) => x.code));
    const helpUsed = myLetters.some((x) => x.helped);
    const won = board.winner; const mineSolved = (board.solved_teams || []).includes(me.team_id);
    const myRow = (board.teams || []).find((x) => x.team_id === me.team_id) || {}; const left = 5 - (myRow.guesses || 0);
    let pos = 0;
    const word = groups.map((g) => { const cells = Array.from({ length: g }, (_, k) => { const i = pos + k; const x = bySlot.get(i); const l = solvedWord ? solvedWord[i] : x && x.letter;
      return `<button class="slot ${l ? 'full' : ''} ${x && x.locked ? 'lock' : ''} ${pick && !l ? 'target' : ''}" data-slot="${i}" aria-label="Box ${i + 1}${l ? ': ' + l : ''}">${l ? esc(l) : ''}</button>`; }).join(''); pos += g; return `<div class="grp">${cells}</div>`; }).join('');
    const qsHtml = myQs.length ? `<section class="card"><strong>Your questions</strong><div class="stack" style="gap:8px">${myQs.map((c) => { const l = myLetters.find((x) => x.code === c.code);
      return `<a class="q" href="/card?c=${encodeURIComponent(c.code)}"><span>${/^H/.test(c.code) ? 'Room card question' : /^B/.test(c.code) ? 'Badge question 2' : 'Badge question'}</span><b>${l ? esc(l.letter) : 'Answer →'}</b></a>`; }).join('')}</div>
      <p class="how" style="margin:0">Each question opens 1 letter. 3 tries: 3 points on the first, then 2, then 1, then 0.</p></section>` : '';
    app.innerHTML = `
      <header class="spread"><span class="eyebrow">Message in a bottle</span><span class="chip ${teamClass(me.team_id)}"><span class="team-dot"></span>${esc(team.name)}</span></header>
      ${qsHtml}
      <section class="card ${teamClass(me.team_id)}"><strong>Your letters</strong>
        <div class="tray">${myLetters.length ? myLetters.map((x) => `<button class="tile ${onBoard.has(x.code) ? 'used' : ''}" data-tile="${esc(x.code)}" draggable="${raceOn}" aria-pressed="${pick === x.code}">${esc(x.letter)}</button>`).join('') : '<span class="muted">Answer your questions to open your letters.</span>'}</div>
        ${raceOn && myLetters.length && !helpUsed && !mineSolved ? `<button class="btn small" data-help>Help: put one of my letters in its right place (−1 point, once)</button>` : helpUsed ? '<span class="how">You used your help.</span>' : ''}
      </section>
      ${raceOn ? `<section class="card ${teamClass(me.team_id)}"><h1 style="font-size:22px">The secret message</h1>
        <div class="word">${word}</div>
        <p class="how" style="margin:0">Tap one of your letters, then a box (or drag it). Tap a filled box to empty it. Your whole team sees the boxes.</p>
        ${won ? `<p class="notice ${won === me.team_id ? 'good' : ''}"><strong>${esc((teams.find((t) => t.id === won) || {}).name || '')}</strong> cracked it first!</p>` : ''}
        ${mineSolved ? '<p class="notice good">Your team cracked it.</p>' : left > 0 ? `<div class="row"><button class="btn primary" data-submit ${slots.length < len ? 'disabled' : ''}>Submit the boxes for ${esc(team.name)}</button><span class="how">${left} of 5 tries left${slots.length < len ? ` · or fill all ${len} boxes` : ''}</span></div>
          <form id="gf" class="row" style="margin-top:4px"><input id="guess" maxlength="60" autocomplete="off" aria-label="Type the whole message" placeholder="Or type the whole message" style="flex:1 1 180px;text-transform:uppercase" value="${esc(guessText)}"><button class="btn">Guess</button></form>
          <span class="how">Missing letters (someone away)? You can type your guess for the whole message. Each guess uses 1 of the 5 tries, and a wrong guess costs 1 point.</span>` : '<p class="notice">Your team used its 5 tries.</p>'}
      </section>` : '<section class="card"><p class="muted" style="margin:0">The word race starts after lunch. Then you will put your letters together with your team here.</p></section>'}
      <nav class="foot-links"><a href="/">Back to the game</a></nav>`;
  }

  async function act(fn, args) { busy = true; try { await rpc(fn, Object.assign({ p_pid: me.id, p_token: me.token }, args)); } catch (e) { toast(e.message, 4000); } busy = false; pick = null; await refresh(); }
  app.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-tile]'); if (t) { pick = pick === t.dataset.tile ? null : t.dataset.tile; render(); return; }
    const sl = e.target.closest('[data-slot]');
    if (sl) { const i = Number(sl.dataset.slot); const x = slots.find((y) => y.slot === i);
      if (pick) return act('race_place', { p_code: pick, p_slot: i });
      if (x && !x.locked) return act('race_clear', { p_slot: i });
      return; }
    if (e.target.closest('[data-help]')) {
      const free = myLetters.find((x) => !slots.some((y) => y.code === x.code && y.locked));
      if (!free) return;
      if (!confirm('Use your one help? It costs your team 1 point and puts your letter ' + free.letter + ' in its right place.')) return;
      return act('race_help_me', { p_code: free.code });
    }
    if (e.target.closest('[data-submit]')) {
      const len = board.length || 0; const g = Array.from({ length: len }, (_, i) => (slots.find((y) => y.slot === i) || {}).letter || '').join('');
      try { const r = await rpc('hunt_guess', { p_pid: me.id, p_token: me.token, p_guess: g });
        toast(r.status === 'correct' ? (r.first ? 'You cracked it first! +10 points' : 'Right! +5 points') : r.status === 'out' ? 'No tries left' : 'Not the message. ' + r.left + ' tries left', 4000); } catch (ex) { toast(ex.message, 4000); }
      refresh();
    }
  });
  app.addEventListener('input', (e) => { if (e.target.id === 'guess') guessText = e.target.value; });
  app.addEventListener('focusout', (e) => { if (e.target.id === 'guess' && pendingRender) { pendingRender = false; setTimeout(() => { if (!document.activeElement || document.activeElement.id !== 'guess') render(); }, 200); } });
  app.addEventListener('submit', async (e) => {
    if (e.target.id !== 'gf') return; e.preventDefault();
    const g = $('#guess').value.trim(); if (!g) return; $('#guess').blur(); guessText = '';
    try { const r = await rpc('hunt_guess', { p_pid: me.id, p_token: me.token, p_guess: g });
      toast(r.status === 'correct' ? (r.first ? 'You cracked it first! +10 points' : 'Right! +5 points') : r.status === 'out' ? 'No tries left' : 'Not the message. ' + r.left + ' tries left', 4000); } catch (ex) { toast(ex.message, 4000); }
    refresh();
  });
  app.addEventListener('dragstart', (e) => { const t = e.target.closest('[data-tile]'); if (t) { pick = t.dataset.tile; e.dataTransfer.setData('text/plain', pick); } });
  app.addEventListener('dragover', (e) => { if (e.target.closest('[data-slot]')) e.preventDefault(); });
  app.addEventListener('drop', (e) => { const sl = e.target.closest('[data-slot]'); if (!sl) return; e.preventDefault(); const c = e.dataTransfer.getData('text/plain') || pick; if (c) act('race_place', { p_code: c, p_slot: Number(sl.dataset.slot) }); });
  start();
})();
</script>
</body>
</html>
