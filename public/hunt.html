<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treasure Hunt · WASH Retreat</title>
<meta name="theme-color" content="#0A6E78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .tiles{display:flex;flex-wrap:wrap;gap:6px}
  .tiles span{width:34px;height:42px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;font-family:var(--display);font-weight:800;font-size:22px}
  .tiles span.on{background:var(--tc);border-color:var(--tc);color:var(--on-team)}
  .clue{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
  .clue .st{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--muted);font-family:var(--display)}
  .clue.done{opacity:.65}
  .clue.done .st{background:var(--good);color:var(--surface)}
  .clue.gold{border-color:var(--gold)}
  .clue p{margin:0}
  .how{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><section class="card"><p class="muted">Loading…</p></section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/lib.js"></script>
<script>
(function () {
  const { $, esc, teamClass, rpc, rows, live } = WR;
  const app = $('#app');
  if (!WR.configured) { WR.setupNotice(app); return; }
  let me = null, cards = [], mine = [], teams = [], secretLen = 0, board = {}, solvedWord = null;

  async function start() {
    try { me = await WR.checkMe(); } catch (e) { me = WR.getMe(); }
    if (!me) return WR.renderJoin(app, (m) => { me = m; go(); });
    go();
  }
  function go() { live(['hunt_cards', 'teams', 'team_points'], refresh, 5000); }

  async function refresh() {
    const [c, t, b] = await Promise.all([rows('hunt_cards', (q) => q.order('position').order('code')), rows('teams', (q) => q.order('id')), rpc('hunt_board')]);
    cards = c; teams = t; secretLen = b.length || 0; board = b;
    try { solvedWord = await rpc('hunt_reveal', { p_pid: me.id, p_token: me.token }); } catch (e) {}
    try { mine = await rpc('hunt_my_team', { p_pid: me.id, p_token: me.token }); } catch (e) { if (/join again/i.test(e.message)) { WR.setMe(null); location.reload(); } }
    render();
  }

  function render() {
    const byId = new Map(mine.map((x) => [x.id, x]));
    const letters = new Map(); cards.forEach((c) => { const m = byId.get(c.id); if (m && m.letter && c.letter_index != null) letters.set(c.letter_index, m.letter); if (m && m.letter2 && c.letter_index2 != null) letters.set(c.letter_index2, m.letter2); });
    
    const team = teams.find((t) => t.id === me.team_id) || { name: 'Your team' };
    const how = { find: 'Find the matching card around the lake and scan its QR code.', text: 'Tap to answer.', quiz: 'Tap to answer.', photo: 'Tap to send a photo.' };
    app.innerHTML = `
      <header class="spread"><span class="eyebrow">Treasure hunt</span><span class="chip ${teamClass(me.team_id)}"><span class="team-dot"></span>${esc(team.name)}</span></header>
      ${(() => {
        const pat = String(board.pattern || '').split(',').map(Number).filter(Boolean);
        const groups = pat.length ? pat : [secretLen]; let pos = 0;
        const tiles = groups.map((len) => { const g = Array.from({ length: len }, (_, k) => { const i = pos + k; const l = solvedWord ? solvedWord[i] : letters.get(i); return `<span class="${l ? 'on' : ''}">${l ? esc(l) : ''}</span>`; }).join(''); pos += len; return `<div class="tiles">${g}</div>`; }).join('');
        const won = board.winner; const mineSolved = (board.solved_teams || []).includes(me.team_id);
        const myRow = (board.teams || []).find((x) => x.team_id === me.team_id) || {}; const left = 5 - (myRow.guesses || 0);
        return `<section class="card ${teamClass(me.team_id)}"><h1 style="font-size:26px">The secret word</h1>
          <div class="stack" style="gap:8px;flex-direction:row;flex-wrap:wrap;column-gap:18px">${tiles}</div>
          <p class="muted small" style="margin:0">Your team has ${letters.size} of ${secretLen} letters. Each person on your team holds a card with 2 letters: get everyone's card right, or guess early.</p>
          ${won ? `<p class="notice ${won === me.team_id ? 'good' : ''}"><strong>${esc((teams.find((t) => t.id === won) || {}).name || '')}</strong> cracked it first!</p>` : ''}
          ${mineSolved ? '<p class="notice good">Your team solved it.</p>' : left > 0 ? `<form id="gf" class="row"><input id="guess" maxlength="60" autocomplete="off" aria-label="Your team's guess" placeholder="Guess the word" style="flex:1 1 180px"><button class="btn primary">Guess</button></form><span class="how">${left} ${left === 1 ? 'guess' : 'guesses'} left for your team. First right guess: +10 points.</span>` : '<p class="notice">Your team used its 5 guesses.</p>'}
        </section>`;
      })()}
      ${(() => {
        const rooms = cards.filter((c) => /^R\d/.test(c.code) && (c.team_id == null || c.team_id === me.team_id)); const lake = cards.filter((c) => !/^R\d/.test(c.code));
        const roomsHtml = rooms.length ? `<section class="card"><strong>Day 1 · Your team's cards</strong><p class="small" style="margin:0">Everyone has a card with their name on it. Scan it and answer: its 2 letters go to your team. You can retry until you get it right.</p>
          <div class="tiles">${rooms.map((c) => { const m = byId.get(c.id) || {}; return `<span class="${m.solved ? 'on' : ''}" title="${esc(c.code)}" style="${!m.solved && m.wrong >= 3 ? 'opacity:.4' : ''}">${m.solved ? esc((m.letter || '') + (m.letter2 || '') || '✓') : esc(c.holder || '·')}</span>`; }).join('')}</div>
          <span class="how">${rooms.filter((c) => (byId.get(c.id) || {}).solved).length} of ${rooms.length} cards done</span></section>` : '';
        const lakeHtml = lake.length ? `<section class="card"><strong>Day 2 · WAP at the lake</strong><p class="small" style="margin:0">Your team leader holds the WAP deck: cards that describe latrines, water sources and wastewater disposal without naming them. For each clue, pick the right card and scan it. A wrong scan uses one of your 3 tries. Field tasks need a photo.</p></section>
          <div class="stack">${lake.map((c, i) => { const m = byId.get(c.id) || {}; const done = m.solved; const locked = !done && m.wrong >= 3;
            const inner = `<span class="st">${done ? '✓' : i + 1}</span><span class="stack" style="gap:4px"><p><strong>${esc(c.prompt)}</strong></p><span class="how">${done ? 'Solved' : locked ? 'Locked: 3 tries used' : how[c.kind] || ''}${!done && !locked && m.wrong ? ` · ${3 - m.wrong} ${3 - m.wrong === 1 ? 'try' : 'tries'} left` : ''} · ${c.points} pt${c.points === 1 ? '' : 's'}</span></span>`;
            return c.kind === 'find' || done || locked ? `<div class="clue ${done ? 'done' : ''} ${c.golden ? 'gold' : ''}">${inner}</div>` : `<a class="clue ${c.golden ? 'gold' : ''}" href="/card?c=${encodeURIComponent(c.code)}">${inner}</a>`; }).join('')}</div>` : '';
        return roomsHtml + lakeHtml;
      })()}
      <nav class="foot-links"><a href="/">Back to the game</a><a href="/spot">Type a card code</a></nav>`;
  }
  app.addEventListener('submit', async (e) => {
    if (e.target.id !== 'gf') return; e.preventDefault();
    const g = $('#guess').value.trim(); if (!g) return;
    try {
      const r = await rpc('hunt_guess', { p_pid: me.id, p_token: me.token, p_guess: g });
      WR.toast(r.status === 'correct' ? (r.first ? 'You cracked it first! +10 points' : 'Right! +5 points') : r.status === 'out' ? 'No guesses left' : 'Not the phrase. ' + r.left + ' left', 4000);
      refresh();
    } catch (ex) { WR.toast(ex.message, 4000); }
  });
  start();
})();
</script>
</body>
</html>
