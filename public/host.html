<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Host · WASH Retreat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .hwrap{max-width:1100px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button{border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:8px 16px;font-weight:600;min-height:40px}
  .tabs button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .sess{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
  .sess summary{cursor:pointer;line-height:1.5}
  .badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
  .badge.open{background:var(--good);color:var(--surface)}
  .list{display:flex;flex-direction:column}
  .li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .li .grow{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
  .li.current{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:8px;padding-inline:8px}
  details.ed{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
  details.ed[open]{box-shadow:0 1px 0 var(--line)}
  details.ed summary{cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ed-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
  .ed-body .full{grid-column:1/-1}
  .pts-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
  .thumbs{display:flex;flex-wrap:wrap;gap:6px}
  .thumbs a img{width:110px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .tablewrap{overflow-x:auto}
  .kpi{font-family:var(--mono);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="hwrap" id="app"><section class="card"><p class="muted">Loading…</p></section></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/sessions.js"></script>
<script src="/lib.js"></script>
<script src="/sap.js"></script>
<script>
(function () {
  const { $, esc, LETTERS, teamClass, rpc, rows, live, toast } = WR;
  const app = $('#app');
  if (!WR.configured) { WR.setupNotice(app); return; }

  const KINDS = { poll: 'Vote', quiz: 'Quiz', words: 'Word cloud', rating: 'Rating 1–5', open: 'Open text', board: 'Sticky-note wall', dots: 'Dot vote', team: 'Team worksheet', allocate: 'Share points' };
  const isArr = (o) => Array.isArray(o);
  const fieldsToText = (fs) => (fs || []).map((f) => [f.label, f.type || 'list', (f.tags || []).join(', ')].filter((x, i) => i < 2 || x).join(' | ')).join('\n');
  const textToFields = (t) => String(t || '').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => { const [label, type, tags] = l.split('|').map((x) => (x || '').trim()); const f = { label, type: type === 'text' ? 'text' : 'list' }; if (tags) f.tags = tags.split(',').map((x) => x.trim()).filter(Boolean); return f; });
  const lines = (t) => String(t || '').split('\n').map((x) => x.trim()).filter(Boolean);
  const SCREENS = [['lobby', 'Join screen'], ['activity', 'Question'], ['leaderboard', 'Top players'], ['teams', 'Team scores'], ['hunt', 'Hunt'], ['podium', 'Podium']];
  let pin = WR.getPin();
  try { const old = sessionStorage.getItem('wr-pin'); if (!pin && old) { pin = old; WR.setPin(old); } } catch (e) {}
  let tab = 'run'; try { tab = sessionStorage.getItem('wr-tab') || 'run'; } catch (e) {}
  const D = { st: {}, teams: [], players: [], acts: [], keys: {}, resp: [], points: [], board: [], cards: null, secret: '', finds: [], checks: [] };

  /* ---------- login ---------- */
  function login(msg) {
    app.innerHTML = `<section class="card" style="max-width:420px;margin:10vh auto 0"><div class="eyebrow">Host</div><h1 style="font-size:28px">Facilitator sign-in</h1>
      <form id="lf" class="stack"><label class="field" for="pin">Host passphrase<input id="pin" type="password" autocomplete="current-password" required></label>
      ${msg ? `<p class="notice bad">${esc(msg)}</p>` : ''}<button class="btn primary block">Open the host panel</button></form></section>`;
    $('#lf').addEventListener('submit', async (e) => {
      e.preventDefault(); const p = $('#pin').value;
      try { if (await rpc('host_check', { p_pin: p })) { pin = p; WR.setPin(p); boot(); } else login('That passphrase is not right.'); }
      catch (x) { login(x.message); }
    });
  }
  const H = (fn, args) => rpc(fn, Object.assign({ p_pin: pin }, args || {}));
  async function act(fn, args, okMsg) {
    try { const r = await H(fn, args); if (okMsg) toast(okMsg); return r; }
    catch (e) { if (/passphrase/i.test(e.message)) { WR.setPin(''); login(e.message); } else toast(e.message, 4000); throw e; }
  }

  /* ---------- data ---------- */
  async function refresh() {
    const [st, teams, players, acts, points] = await Promise.all([rows('state'), rows('teams', (q) => q.order('id')), rows('participants', (q) => q.order('created_at')), rows('activities', (q) => q.order('position')), rows('team_points', (q) => q.order('created_at', { ascending: false }).limit(200))]);
    D.st = st[0] || {}; D.teams = teams; D.players = players; D.acts = acts; D.points = points;
    D.resp = D.st.activity_id ? await rows('responses', (q) => q.eq('activity_id', D.st.activity_id)) : [];
    try { D.board = await rpc('scoreboard'); } catch (e) {}
    if (tab === 'run' || tab === 'teams') paintTab(false);
    paintHeader();
  }
  async function loadKeys() { D.keys = (await act('host_keys')) || {}; }
  async function loadCards() { const r = await act('host_cards'); D.cards = r.cards || []; D.secret = r.secret || ''; try { D.pattern = (await rpc('hunt_board')).pattern || ''; } catch (e) { D.pattern = ''; } }

  /* ---------- shell ---------- */
  function boot() {
    app.innerHTML = `<header class="spread"><div class="stack" style="gap:2px"><span class="eyebrow">${esc(WR.cfg.eventName)}</span><h1 style="font-size:26px">Host panel</h1></div>
      <div class="row"><span id="hdr" class="small muted"></span><a class="btn small" href="/print" target="_blank" rel="noopener">Print checklist</a><a class="btn small" href="/screen" target="_blank" rel="noopener">Open the projector screen</a></div></header>
      <nav class="tabs" id="tabs"></nav><div id="tab"></div>`;
    paintTabs();
    loadKeys().catch(() => {});
    live(['state', 'activities', 'responses', 'participants', 'teams', 'team_points'], refresh, 5000);
    paintTab(true);
  }
  function paintHeader() { const h = $('#hdr'); if (h) h.textContent = `${D.players.length} players joined`; }
  function paintTabs() {
    const T = [['run', 'Run'], ['questions', 'Questions'], ['teams', 'Teams & points'], ['hunt', 'Treasure hunt'], ['sap', 'Site test (SAP)'], ['reset', 'Reset']];
    $('#tabs').innerHTML = T.map(([k, l]) => `<button data-tab="${k}" aria-current="${k === tab}">${l}</button>`).join('');
  }
  function typing() { const a = document.activeElement; return a && $('#tab') && $('#tab').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
  async function paintTab(force) {
    const el = $('#tab'); if (!el) return;
    if (!force && typing()) return;
    if (tab === 'questions' && force) await loadKeys().catch(() => {});
    if (tab === 'hunt' && (force || !D.cards)) { await loadCards().catch(() => {}); try { D.finds = await H('host_finds'); D.spots = await rows('hunt_spots', (q) => q.order('position')); } catch (e) {} }
    if (tab === 'sap' && force) { try { D.sapAcc = await H('host_sap_accuracy'); D.sap = await Promise.all(D.teams.map((t) => rpc('sap_summary', { p_team: t.id }))); } catch (e) {} }
    if (tab === 'checks' && force) { try { D.checks = await H('host_assessments'); } catch (e) {} }
    const y = window.scrollY;
    el.innerHTML = ({ run: tRun, questions: tQuestions, teams: tTeams, hunt: tHunt, checks: tChecks, sap: tSap, reset: tReset })[tab]();
    if (!force) window.scrollTo(0, y);
  }

  /* ---------- Run ---------- */
  function tRun() {
    const st = D.st, a = D.acts.find((x) => x.id === st.activity_id);
    const idx = a ? D.acts.indexOf(a) : -1;
    const n = D.resp.length;
    let ctl = '<p class="muted" style="margin:0">Pick a question below to show it.</p>';
    if (a) {
      const ph = st.phase;
      ctl = `<div class="spread"><div class="stack" style="gap:4px;min-width:0"><span class="small muted">${KINDS[a.kind]} · #${a.position}</span><strong style="font-size:18px;overflow-wrap:anywhere">${esc(a.title)}</strong></div>
        <span class="badge ${ph === 'open' ? 'open' : ''}">${({ idle: 'Not open yet', open: 'Answers open', closed: 'Closed', reveal: 'Answer shown' })[ph]}</span></div>
        <div class="spread"><span><span class="kpi">${n}</span> <span class="muted">${['board', 'dots', 'team'].includes(a.kind) ? 'see the screen for progress' : 'of ' + D.players.length + ' answered'}</span></span>
        ${a.kind === 'quiz' ? `<span class="small muted">Correct: ${D.keys[a.id] != null ? LETTERS[D.keys[a.id]] + '. ' + esc(a.options[D.keys[a.id]] || '') : 'not set'}</span>` : ''}</div>
        <div class="row">
          ${ph !== 'open' ? `<button class="btn primary" data-do="phase" data-v="open">${ph === 'idle' ? 'Open answers' : 'Open again'}</button>` : `<button class="btn" data-do="phase" data-v="closed">Close answers</button>`}
          ${a.kind === 'quiz' && ph !== 'reveal' ? `<button class="btn primary" data-do="phase" data-v="reveal">Reveal answer</button>` : ''}
          ${idx < D.acts.length - 1 ? `<button class="btn" data-do="show" data-id="${D.acts[idx + 1].id}">Next: #${D.acts[idx + 1].position}</button>` : ''}
          <button class="btn danger" data-do="clear" data-id="${a.id}">Clear answers</button>
        </div>`;
    }
    const podium = st.screen === 'podium' ? `<section class="card"><h2 style="font-size:18px">Podium</h2><div class="row"><button class="btn primary" data-do="podium" data-v="${Math.min(3, (st.podium_step || 0) + 1)}" ${(st.podium_step || 0) >= 3 ? 'disabled' : ''}>${['Reveal 3rd place', 'Reveal 2nd place', 'Reveal the winner', 'All revealed'][st.podium_step || 0]}</button><button class="btn" data-do="podium" data-v="0">Start over</button></div></section>` : '';
    const steps = WR.flow.build(D.acts); const si = WR.flow.indexOf(steps, st);
    const presenter = `<section class="card" style="border-color:var(--accent)"><div class="spread"><h2 style="font-size:18px">Present</h2><span class="small muted">Step ${si + 1} of ${steps.length}</span></div>
      <div class="small muted">Now: <strong style="color:var(--ink)">${esc(WR.flow.label(steps[si]))}</strong></div>
      <div class="row"><button class="btn" data-do="prev" ${si <= 0 ? 'disabled' : ''}>◀ Back</button><button class="btn primary" data-do="next" style="flex:1 1 200px" ${si >= steps.length - 1 ? 'disabled' : ''}>Next ▶ ${esc(WR.flow.label(steps[si + 1]).slice(0, 48))}</button></div>
      <p class="muted small" style="margin:0">Or press the ← → arrow keys here or on the projector screen. Each question opens by itself; a quiz then reveals the answer and shows the top players.</p></section>`;
    return `<div class="grid2">
      <div class="stack">${presenter}
        <section class="card"><h2 style="font-size:18px">The screen shows</h2><div class="seg">${SCREENS.map(([k, l]) => `<button data-do="screen" data-v="${k}" aria-pressed="${st.screen === k}">${l}</button>`).join('')}</div></section>
        <section class="card"><h2 style="font-size:18px">Now</h2>${ctl}</section>${podium}
        <section class="card"><h2 style="font-size:18px">Team scores</h2>${(D.board || []).map((t) => `<div class="pts-row ${teamClass(t.team_id)}"><span class="row"><span class="team-dot"></span><strong>${esc(t.name)}</strong></span><span class="timer">${t.manual + t.hunt + t.quiz}</span></div>`).join('')}</section>
      </div>
      <section class="card"><h2 style="font-size:18px">Sessions and questions</h2>${(() => {
        const qrow = (x) => `<div class="li ${x.id === st.activity_id ? 'current' : ''}"><span class="badge">${KINDS[x.kind]}</span><span class="grow">#${x.position} ${esc(x.title)}</span>
        <button class="btn small" data-do="show" data-id="${x.id}">Show</button><button class="btn small primary" data-do="showopen" data-id="${x.id}">Show + open</button></div>`;
        if (!D.acts.length) return '<p class="muted">No questions yet. Add them in the Questions tab.</p>';
        const S = window.WR_SESSIONS || []; const used = new Set();
        const cur = (st.screen === 'session' || st.screen === 'hunt') ? st.session_key : ((S.of && D.acts.find((x) => x.id === st.activity_id)) ? (S.of(D.acts.find((x) => x.id === st.activity_id).position) || {}).key : null);
        const blocks = S.map((s) => { const qs = D.acts.filter((a) => a.position >= s.from && a.position <= s.to); qs.forEach((a) => used.add(a.id));
          return `<details class="sess" ${s.key === cur ? 'open' : ''}><summary><span class="badge">Day ${s.day}</span> <strong>${esc(s.label)}</strong> · ${esc(s.title)}${s.sub ? ' <span class="muted">(' + esc(s.sub) + ')</span>' : ''} <span class="small muted">${esc(s.time)}${qs.length ? ' · ' + qs.length + ' q' : ''}</span></summary>
            <div class="stack" style="gap:8px;padding-top:8px"><div class="row"><button class="btn small primary" data-do="session" data-v="${s.key}">Show session card</button>${s.screen === 'hunt' ? `<button class="btn small" data-do="sessionhunt" data-v="${s.key}">Show word race / hunt</button>` : ''}</div>
            <ul class="small muted" style="margin:0;padding-left:1.2em">${s.host.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>
            <div class="list">${qs.map(qrow).join('')}</div></div></details>`; }).join('');
        const rest = D.acts.filter((a) => !used.has(a.id));
        return blocks + (rest.length ? `<details class="sess"><summary><strong>Other questions</strong></summary><div class="list">${rest.map(qrow).join('')}</div></details>` : '');
      })()}</section>
    </div>`;
  }

  /* ---------- Questions ---------- */
  function tQuestions() {
    const ed = (a) => {
      const opts = isArr(a.options) ? a.options.join('\n') : '';
      const corr = D.keys[a.id];
      return `<details class="ed" data-aid="${a.id}"><summary><span class="badge">${KINDS[a.kind]}</span>#${a.position} ${esc(a.title || 'Untitled')}</summary>
        <form class="ed-body" data-form="act" data-id="${a.id}">
          <label class="field full" for="t-${a.id}">Question<textarea id="t-${a.id}" name="title" rows="2">${esc(a.title)}</textarea></label>
          <label class="field" for="k-${a.id}">Type<select id="k-${a.id}" name="kind">${Object.entries(KINDS).map(([k, l]) => `<option value="${k}" ${k === a.kind ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          <label class="field" for="p-${a.id}">Order<input id="p-${a.id}" name="position" type="number" value="${a.position}"></label>
          ${['poll', 'quiz'].includes(a.kind) ? `<label class="field full" for="o-${a.id}">Options, one per line (max 6)<textarea id="o-${a.id}" name="options" rows="4">${esc(opts)}</textarea></label>` : ''}
          ${a.kind === 'board' ? `<label class="field full" for="bc-${a.id}">Columns, one per line<textarea id="bc-${a.id}" name="b_columns" rows="5">${esc(((a.options || {}).columns || []).join('\n'))}</textarea></label><label class="field full" for="bt-${a.id}">Note colours, one per line (max 5)<textarea id="bt-${a.id}" name="b_tags" rows="3">${esc(((a.options || {}).tags || []).join('\n'))}</textarea></label>` : ''}
          ${a.kind === 'dots' ? `<label class="field" for="db-${a.id}">Votes on the wall<select id="db-${a.id}" name="d_board">${D.acts.filter((x) => x.kind === 'board').map((x) => `<option value="${x.id}" ${(a.options || {}).board === x.id ? 'selected' : ''}>#${x.position} ${esc(x.title)}</option>`).join('')}</select></label><label class="field" for="dn-${a.id}">Dots per person<input id="dn-${a.id}" name="d_dots" type="number" min="1" max="10" value="${(a.options || {}).dots || 3}"></label>` : ''}
          ${a.kind === 'team' ? `<label class="field full" for="tf-${a.id}">Fields, one per line: Label | list or text | tags (optional, comma-separated)<textarea id="tf-${a.id}" name="t_fields" rows="5">${esc(fieldsToText((a.options || {}).fields))}</textarea></label><label class="field full" for="tp-${a.id}">Card for each team, one line per team in order (optional)<textarea id="tp-${a.id}" name="t_prompts" rows="3">${esc(((a.options || {}).prompts || []).join('\n'))}</textarea></label>` : ''}
          ${a.kind === 'allocate' ? `<label class="field full" for="ai-${a.id}">What people give points to, one per line (empty = the teams)<textarea id="ai-${a.id}" name="a_items" rows="3">${esc(((a.options || {}).items || []).join('\n'))}</textarea></label><label class="field" for="ab-${a.id}">Points each person can give<input id="ab-${a.id}" name="a_budget" type="number" min="1" value="${(a.options || {}).budget || 100}"></label>` : ''}
          ${a.kind === 'rating' ? `<label class="field" for="lo-${a.id}">Label for 1<input id="lo-${a.id}" name="lo" value="${esc((isArr(a.options) && a.options[0]) || '')}"></label><label class="field" for="hi-${a.id}">Label for 5<input id="hi-${a.id}" name="hi" value="${esc((isArr(a.options) && a.options[1]) || '')}"></label>` : ''}
          ${a.kind === 'quiz' ? `<label class="field" for="c-${a.id}">Correct answer<select id="c-${a.id}" name="correct">${(isArr(a.options) ? a.options : []).map((o, i) => `<option value="${i}" ${corr === i ? 'selected' : ''}>${LETTERS[i]}. ${esc(o)}</option>`).join('')}</select></label>
            <label class="field" for="tl-${a.id}">Seconds to answer<input id="tl-${a.id}" name="time_limit" type="number" min="5" max="300" value="${a.time_limit}"></label>` : ''}
          ${a.kind === 'words' ? `<label class="field" for="mw-${a.id}">Words per person<input id="mw-${a.id}" name="max_words" type="number" min="1" max="5" value="${a.max_words}"></label>` : ''}
          <div class="row full"><button class="btn primary" type="submit">Save</button><button class="btn danger" type="button" data-do="delact" data-id="${a.id}">Delete</button></div>
        </form></details>`;
    };
    return `<div class="stack"><section class="card"><h2 style="font-size:18px">Add a question</h2><div class="row">${Object.entries(KINDS).map(([k, l]) => `<button class="btn small" data-do="addact" data-v="${k}">+ ${l}</button>`).join('')}</div>
      <p class="muted small" style="margin:0">Quiz: faster correct answers score up to 1000 points per player, and each correct answer gives the player's team 1 point.</p></section>
      ${D.acts.map(ed).join('')}</div>`;
  }
  async function saveAct(form) {
    const id = form.dataset.id; const a = D.acts.find((x) => x.id === id); const f = new FormData(form);
    const kind = f.get('kind') || a.kind;
    const data = { title: (f.get('title') || '').trim(), kind, position: Number(f.get('position')) || a.position };
    if (f.has('options')) data.options = String(f.get('options')).split('\n').map((s) => s.trim()).filter(Boolean).slice(0, 6);
    if (f.has('lo')) data.options = [String(f.get('lo')).trim(), String(f.get('hi')).trim()];
    if (f.has('correct')) data.correct = Number(f.get('correct'));
    if (f.has('time_limit')) data.time_limit = Math.max(5, Number(f.get('time_limit')) || 20);
    if (f.has('max_words')) data.max_words = Math.min(5, Math.max(1, Number(f.get('max_words')) || 1));
    if (f.has('b_columns')) data.options = { columns: lines(f.get('b_columns')), tags: lines(f.get('b_tags')).slice(0, 5) };
    if (f.has('d_board')) data.options = { board: f.get('d_board'), dots: Math.max(1, Number(f.get('d_dots')) || 3) };
    if (f.has('t_fields')) data.options = { fields: textToFields(f.get('t_fields')), prompts: lines(f.get('t_prompts')) };
    if (f.has('a_items')) data.options = { items: lines(f.get('a_items')), budget: Math.max(1, Number(f.get('a_budget')) || 100) };
    if (kind !== a.kind) {
      const dflt = { poll: ['Option 1', 'Option 2'], quiz: ['Answer A', 'Answer B', 'Answer C', 'Answer D'], rating: ['Low', 'High'], words: [], open: [],
        board: { columns: ['Column 1', 'Column 2'], tags: ['Worked', 'Broke down', 'Surprise'] }, dots: { board: (D.acts.find((x) => x.kind === 'board') || {}).id || '', dots: 3 },
        team: { fields: [{ label: 'Our answer', type: 'list' }] }, allocate: { items: [], budget: 100 } };
      data.options = dflt[kind];
    }
    if (['poll', 'quiz'].includes(kind) && !['poll', 'quiz'].includes(a.kind) && !data.options) data.options = ['Option 1', 'Option 2'];
    if (['poll', 'quiz'].includes(kind) && ((data.options || a.options) || []).length < 2) { toast('Add at least 2 options.'); return; }

        <p class="muted small" style="margin:0">${D.secret.length} letters. Type it with spaces (WASH TOGETHER) so the screen shows the word breaks. Only you see this.</p></section>
      <section class="card"><h2 style="font-size:18px">QR codes: what is open now</h2>
        <p class="muted small" style="margin:0">Everything starts closed. Each group opens by itself when you reach its session with Next. You can also switch them here.</p>
        <div class="list">${Object.entries(WR.GROUPS).map(([g, l]) => { const on = WR.isLive(D.st, g); return `<div class="li"><span class="badge ${on ? 'open' : ''}">${on ? 'Open' : 'Closed'}</span><span class="grow">${esc(l)}</span><button class="btn small ${on ? '' : 'primary'}" data-do="live" data-v="${g}">${on ? 'Close' : 'Open now'}</button></div>`; }).join('')}</div></section>
      ${(() => { const R = C.filter((c) => /^R\d/.test(c.code) && c.team_id); if (!R.length) return '';
        return `<section class="card"><h2 style="font-size:18px">Who gets which card (Day 1)</h2><p class="muted small" style="margin:0">One card per person, 2 letters each. Every team's 6 cards spell the whole word. Type each name, then print the person cards: the name is printed on the card.</p>
        <form data-form="holders" class="stack">${D.teams.map((t) => `<div class="stack" style="gap:6px"><strong class="${teamClass(t.id)}"><span class="team-dot"></span> ${esc(t.name)}</strong>${R.filter((c) => c.team_id === t.id).map((c) => `<div class="row"><code style="width:3em">${esc(c.code)}</code><strong style="width:3.2em;letter-spacing:.1em">${esc((D.secret[c.letter_index] || '') + (D.secret[c.letter_index2] || ''))}</strong><input name="h-${c.id}" value="${esc(c.holder || '')}" placeholder="Name" aria-label="Name for card ${esc(c.code)}" maxlength="60" style="flex:1 1 160px"></div>`).join('')}</div>`).join('')}

      <section class="card"><div class="spread"><h2 style="font-size:18px">Cards (${C.length})</h2><div class="row"><button class="btn small" data-do="addcard">+ Add card</button><a class="btn small primary" href="/print" target="_blank" rel="noopener">Print checklist</a></div></div></section>

      <section class="card"><h2 style="font-size:18px">WAP cards for the lake (${(D.spots || []).length})</h2><p class="muted small" style="margin:0">Printed with their QR codes. A "find" clue is solved by scanning one of its right cards.</p>
        <div class="tablewrap"><table><tbody>${(D.spots || []).map((sp) => `<tr><td><code>${esc(sp.code)}</code></td><td>${esc(sp.grp)}</td><td>${esc(sp.description)}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="card"><div class="spread"><h2 style="font-size:18px">Answers and photos sent</h2><button class="btn small" data-do="reloadfinds">Refresh</button></div>
        <div class="list">${(D.finds || []).map((f) => `<div class="li"><span class="badge" style="${f.correct ? 'background:var(--good);color:var(--surface)' : ''}">${f.correct ? 'Correct' : 'Wrong'}</span><span class="grow"><code>${esc(f.code)}</code> · ${esc((D.teams.find((t) => t.id === f.team_id) || {}).name || '')} · ${esc(f.player || '')}${f.answer ? ' · “' + esc(f.answer) + '”' : ''}</span>${f.photo ? `<span class="thumbs"><a href="${esc(f.photo)}" target="_blank" rel="noopener"><img src="${esc(f.photo)}" alt="Hunt photo"></a></span>` : ''}</div>`).join('') || '<p class="muted">Nothing yet.</p>'}</div></section>
    </div>`;
  }
  async function saveCard(form) {
    const id = form.dataset.id; const c = (D.cards || []).find((x) => x.id === id); const f = new FormData(form);
    const kind = f.get('kind');
    const data = { prompt: String(f.get('prompt') || '').trim(), kind, code: String(f.get('code') || '').trim(), points: Math.max(0, Number(f.get('points')) || 0), golden: f.get('golden') === 'on', letter_index: f.get('letter') === '' ? '' : String(Math.max(0, Number(f.get('letter')) - 1)), letter_index2: (f.get('letter2') || '') === '' ? '' : String(Math.max(0, Number(f.get('letter2')) - 1)), team_id: String(f.get('team_id') || ''), holder: String(f.get('holder') || '').trim() };
    if (f.has('options')) data.options = String(f.get('options')).split('\n').map((s) => s.trim()).filter(Boolean).slice(0, 6);
    if (f.has('answer')) data.answer = String(f.get('answer')).trim();
    if (kind === 'quiz' && c.kind !== 'quiz') { data.options = data.options || ['', '']; data.answer = '0'; }
    await act('host_save_card', { p_id: id, p_data: data }, 'Card saved');
    reopenCard = id; paintTab(true);

  let reopenCard = null;

  /* ---------- Site checks ---------- */
  function tChecks() {
    const C = D.checks || [];
    return `<div class="stack"><section class="card"><div class="spread"><h2 style="font-size:18px">Site checks sent (${C.length})</h2><button class="btn small" data-do="reloadchecks">Refresh</button></div></section>

        <span class="small muted">${esc(c.player || '')} · ${esc((D.teams.find((t) => t.id === c.team_id) || {}).name || '')} · ${new Date(c.at).toLocaleString()}${c.lat != null ? ` · <a href="https://www.google.com/maps?q=${c.lat},${c.lng}" target="_blank" rel="noopener">map</a>` : ''}</span>

        ${(c.photos || []).length ? `<div class="thumbs">${c.photos.map((p) => `<a href="${esc(p.url)}" target="_blank" rel="noopener" title="${esc(p.label)}"><img src="${esc(p.url)}" alt="${esc(p.label)}"></a>`).join('')}</div>` : ''}</section>`).join('') || '<section class="card"><p class="muted" style="margin:0">No site checks yet. Players open them from the link at the bottom of the game page.</p></section>'}</div>`;

  function tSap() {
    const acc = D.sapAcc || []; const sums = D.sap || [];
    return `<div class="stack"><section class="card"><div class="spread"><h2 style="font-size:18px">WASH SAP field test</h2><button class="btn small" data-do="reloadsap">Refresh</button></div>
      <p class="muted small" style="margin:0">Each team assesses its own site: 1 site card and 10 tent cards (print them from Treasure hunt → Print cards). Accuracy compares the household forms with what is written on the tent cards.</p></section>
      <div class="grid2">${D.teams.map((t, i) => { const S = sums[i] ? SAP.summarise(sums[i]) : null; const a = acc.find((x) => x.team_id === t.id) || {};
        return `<section class="card ${teamClass(t.id)}"><h2 style="font-size:18px;display:flex;gap:8px;align-items:center"><span class="team-dot"></span>${esc(t.name)}</h2>
          ${S ? `<div class="tablewrap"><table><tbody>
            <tr><td>Households done / sample</td><td>${S.done} / ${S.need}</td></tr><tr><td>Site form</td><td>${S.siteDone ? 'Sent' + (S.siteBy ? ' by ' + esc(S.siteBy) : '') : 'Not yet'}</td></tr>
            <tr><td>Accuracy vs tent cards</td><td>${a.checked ? Math.round((a.right / a.checked) * 100) + '% (' + a.right + ' of ' + a.checked + ' answers)' : '–'}</td></tr>

            <tr><td>Tanks (household + community)</td><td>${S.hhTanks} + ${S.cTanks}</td></tr><tr><td>Latrines (inside + outside)</td><td>${S.latIn} + ${S.latOut}</td></tr></tbody></table></div>` : '<p class="muted">No data yet.</p>'}
          <a class="btn small" href="/sap?team=${t.id}" target="_blank" rel="noopener">Show this team's summary on the projector</a></section>`; }).join('')}</div></div>`;

  /* ---------- Reset ---------- */
  function tReset() {
    const items = [['answers', 'Clear all answers', 'Removes every vote, word, quiz answer, sticky note and team worksheet, including quiz points.'], ['points', 'Clear team points', 'Removes all points you gave by hand.'], ['hunt', 'Clear hunt progress', 'Removes all cards found. The cards stay.'], ['checks', 'Clear the site test', 'Removes all site and household forms.'], ['players', 'Remove all players', 'Everyone has to join again. Their answers are removed too.'], ['all', 'Reset everything', 'All of the above. Questions and hunt cards stay.']];
    return `<section class="card"><h2 style="font-size:18px">Reset before the retreat</h2><p class="muted" style="margin:0">Use these after your test run. Each button asks you to click twice.</p>
      <div class="list">${items.map(([k, l, d]) => `<div class="li"><span class="grow"><strong>${l}</strong><br><span class="small muted">${d}</span></span><button class="btn small danger" data-do="reset" data-v="${k}">${l}</button></div>`).join('')}</div></section>`;
  }

  async function move(dir) {
    const steps = WR.flow.build(D.acts); const i = WR.flow.indexOf(steps, D.st); const j = i + dir;
    if (j < 0 || j >= steps.length) return;
    await act('host_set_state', { p_patch: dir > 0 ? WR.flow.patch(steps[j]) : WR.flow.patchBack(steps[j]) });
  }
  document.addEventListener('keydown', async (e) => {
    if (!pin || tab !== 'run' || /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); try { await move(1); await refresh(); } catch (x) {} }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); try { await move(-1); await refresh(); } catch (x) {} }
  });

  /* ---------- events ---------- */
  app.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-tab]');
    if (t) { tab = t.dataset.tab; try { sessionStorage.setItem('wr-tab', tab); } catch (x) {} paintTabs(); paintTab(true); return; }
    const b = e.target.closest('[data-do]'); if (!b || b.disabled) return;
    if (b.classList.contains('danger') && !b.dataset.armed) {
      b.dataset.armed = '1'; const old = b.textContent; b.textContent = 'Click again to confirm';
      setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; } }, 3500); return;
    }
    const v = b.dataset.v, id = b.dataset.id;
    try {
      switch (b.dataset.do) {
        case 'screen': await act('host_set_state', { p_patch: { screen: v } }); break;
        case 'session': { const st = WR.flow.build(D.acts).find((x) => x.k === 'session' && x.s.key === v); await act('host_set_state', { p_patch: st ? WR.flow.patch(st) : { screen: 'session', session: v } }); break; }
        case 'sessionhunt': { const st = WR.flow.build(D.acts).find((x) => x.k === 'hunt' && x.s.key === v); await act('host_set_state', { p_patch: st ? WR.flow.patch(st) : { screen: 'hunt', session: v } }); break; }
        case 'live': { const cur = Array.isArray(D.st.live) ? D.st.live.slice() : []; const nx = cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat(v); await act('host_set_state', { p_patch: { live: nx } }, (cur.includes(v) ? 'Closed: ' : 'Open: ') + WR.GROUPS[v]); paintTab(true); break; }
        case 'phase': await act('host_set_state', { p_patch: { phase: v } }); break;
        case 'show': await act('host_set_state', { p_patch: { activity_id: id, screen: 'activity', phase: 'open' } }); break;
        case 'showopen': await act('host_set_state', { p_patch: { activity_id: id, screen: 'activity', phase: 'open' } }, 'Answers are open'); break;
        case 'clear': await act('host_clear_responses', { p_activity: id }, 'Answers cleared'); break;
        case 'podium': await act('host_set_state', { p_patch: { podium_step: Number(v) } }); break;
        case 'next': await move(1); break;
        case 'prev': await move(-1); break;
        case 'addact': {
          const defaults = { poll: ['Option 1', 'Option 2'], quiz: ['Answer A', 'Answer B', 'Answer C', 'Answer D'], rating: ['Low', 'High'], words: [], open: [],
            board: { columns: ['Column 1', 'Column 2'], tags: ['Worked', 'Broke down', 'Surprise'] }, dots: { board: (D.acts.find((x) => x.kind === 'board') || {}).id || '', dots: 3 },
            team: { fields: [{ label: 'Our answer', type: 'list' }] }, allocate: { items: [], budget: 100 } };
          const nid = await act('host_save_activity', { p_id: null, p_data: { kind: v, title: 'New ' + KINDS[v].toLowerCase(), options: defaults[v], correct: v === 'quiz' ? 0 : null, max_words: v === 'words' ? 1 : 3 } }, 'Added');
          await refresh(); await loadKeys(); reopen = nid; paintTab(true); return;
        }
        case 'delact': await act('host_delete_activity', { p_id: id }, 'Deleted'); await refresh(); paintTab(true); return;
        case 'pts': { const r = ($('#reason') || {}).value || ''; await act('host_add_points', { p_team: Number(b.dataset.team), p_points: Number(b.dataset.n), p_reason: r.trim() }, `${Number(b.dataset.n) > 0 ? '+' : ''}${b.dataset.n} points`); break; }
        case 'delpts': await act('host_delete_points', { p_id: Number(id) }, 'Removed'); break;
        case 'delplayer': await act('host_delete_player', { p_pid: id }, 'Player removed'); break;
        case 'addcard': { const nid = await act('host_save_card', { p_id: null, p_data: { kind: 'text', prompt: '', points: 1 } }, 'Card added'); reopenCard = nid; paintTab(true); return; }
        case 'delcard': await act('host_delete_card', { p_id: id }, 'Card deleted'); paintTab(true); return;
        case 'reloadfinds': paintTab(true); return;
        case 'reloadchecks': paintTab(true); return;
        case 'reloadsap': paintTab(true); return;
        case 'reset': await act('host_reset', { p_what: v }, 'Done'); break;
      }
      await refresh();

  });
  app.addEventListener('change', async (e) => {

    if (e.target.name === 'kind' && e.target.form && e.target.form.dataset.form) { e.target.form.requestSubmit(); }
  });
  app.addEventListener('submit', async (e) => {
    const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
    try {
      if (f.dataset.form === 'act') await saveAct(f);
      if (f.dataset.form === 'card') await saveCard(f);
      if (f.dataset.form === 'team') { await act('host_rename_team', { p_team: Number(f.dataset.id), p_name: new FormData(f).get('name') }, 'Renamed'); await refresh(); }
      if (f.dataset.form === 'holders') { const fd = new FormData(f); for (const [k, v] of fd.entries()) { const id = k.slice(2); const c = (D.cards || []).find((x) => x.id === id); if (c && (c.holder || '') !== String(v).trim()) await act('host_save_card', { p_id: id, p_data: { holder: String(v).trim() } }); } toast('Names saved'); paintTab(true); return; }
      if (f.dataset.form === 'secret') { await act('host_set_secret', { p_word: new FormData(f).get('secret') }, 'Secret word saved'); paintTab(true); }
    } catch (x) {}
  });
  // Keep the edited item open after a save.
  new MutationObserver(() => {
    if (reopen) { const d = app.querySelector(`details[data-aid="${reopen}"]`); if (d) { d.open = true; reopen = null; } }
    if (reopenCard) { const d = app.querySelector(`details[data-cid="${reopenCard}"]`); if (d) { d.open = true; d.scrollIntoView({ block: 'nearest' }); reopenCard = null; } }
  }).observe(app, { childList: true, subtree: true });

  if (pin) rpc('host_check', { p_pin: pin }).then((ok) => (ok ? boot() : login())).catch((x) => login(x.message));
  else login();
})();
</script>
</body>
</html>
