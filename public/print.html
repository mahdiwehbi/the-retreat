<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Print Checklist · WASH Retreat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style id="base">
  :root{--ink:#1B2430;--muted:#5B6573;--accent:#0A6E78;--line:#C8D8DA;--t1:#0A6E78;--t2:#C2410C;--t3:#6D28D9;--l1:#E3F2F3;--l2:#FBEADF;--l3:#EEE7FB}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  @media screen{#out{zoom:var(--z,1.35)} #out .solo-badge{display:inline-block;margin:6mm}}
  body{margin:0;background:#E9EFF0;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
  .tcf{--tc:#0B3954;--tl:#E3EEF6}
  .badge .facnote{margin-top:9mm;font-family:'Fraunces',serif;font-weight:700;font-size:18pt;color:var(--tc);text-align:center;line-height:1.2}
  .badge .facnote span{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:10pt;color:var(--muted)}
  .badge .facnote .drop{display:block;margin:0 auto 2mm;width:11mm;height:15mm}
  .tc1{--tc:var(--t1);--tl:var(--l1)} .tc2{--tc:var(--t2);--tl:var(--l2)} .tc3{--tc:var(--t3);--tl:var(--l3)}
  /* hub */
  .hub{max-width:880px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:14px}
  .hub h1{font-family:'Fraunces',serif;font-size:32px;margin:0}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .box h2{margin:0;font-size:18px}
  .muted{color:var(--muted)} .small{font-size:14px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;min-height:44px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn[aria-pressed="true"]{background:var(--accent);color:#fff}
  .item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eef2f3}
  .item:first-of-type{border-top:0}
  .item input[type=checkbox]{width:22px;height:22px}
  .item strong{display:block}
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  .rooms label{display:flex;gap:8px;align-items:center;font-size:14px}
  .rooms input{width:80px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
  .notice{background:#FFF7E6;border:1px solid #F0D79B;border-radius:10px;padding:10px 12px;font-size:14px}
  .preview-bar{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #out{padding:12px 0}
  /* sheets */
  .sheet{background:#fff;margin:12px auto;position:relative;overflow:hidden}
  .a4{width:210mm;height:297mm;padding:10mm;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:88mm;gap:6mm}
  .a4.one{grid-template-columns:1fr;grid-auto-rows:auto}
  .a4.badges{padding:13.5mm 5mm;grid-template-columns:100mm 100mm;grid-auto-rows:135mm;gap:0;justify-content:center}
  .a4.a5x2{padding:0;grid-template-columns:1fr;grid-auto-rows:148.5mm;gap:0}
  .solo-badge{width:100mm;height:135mm}
  .solo-a5{width:210mm;height:148mm}
  /* badge */
  .badge{width:100mm;height:135mm;position:relative;background:#fff;display:flex;flex-direction:column;align-items:center;outline:0.2mm dashed #ccc;overflow:hidden}
  .badge .band{position:absolute;left:0;top:0;width:100%;height:38mm;background:var(--tl)}
  .badge .band svg,.a5 .band svg{position:absolute;left:0;bottom:-1px;width:100%;height:6mm}
  .badge .logo{position:relative;margin-top:5mm;height:13mm}
  .badge .theme{position:relative;margin-top:2mm;font-weight:700;font-size:9pt;letter-spacing:.06em;color:var(--tc)}
  .badge .ev{position:relative;font-size:7.5pt;color:var(--muted)}
  .badge .first{margin-top:10mm;font-weight:700;font-size:28pt;line-height:1}
  .badge .last{font-size:14pt;margin-top:1mm}
  .badge .pill{margin-top:3mm;background:var(--tc);color:#fff;font-weight:700;font-size:11pt;letter-spacing:.04em;padding:1.2mm 6mm;border-radius:99px;text-transform:uppercase}
  .badge .qr img{width:40mm;height:40mm;margin-top:4mm;display:block}
  .badge.back{align-items:stretch;padding:6mm 7mm 12mm}
  .badge.back .bhead{display:flex;gap:3mm;align-items:center;border-bottom:0.5mm solid var(--tc);padding-bottom:2mm;margin-bottom:1mm}
  .badge.back .bhead img{height:8mm}
  .badge.back .theme{margin:0;font-size:10pt}
  .badge.back .bday{font-weight:700;font-size:7.5pt;letter-spacing:.06em;text-transform:uppercase;color:var(--tc);margin:2mm 0 .6mm}
  .badge.back .br{display:grid;grid-template-columns:9mm 1fr;gap:1.5mm;font-size:7.4pt;line-height:1.25;padding:.25mm 1mm;border-radius:.8mm}
  .badge.back .br.mv{background:#FFE9B8;font-weight:700}
  .badge .roomtag{margin-top:2.5mm;font-weight:700;font-size:12pt;color:#fff;background:var(--tc);padding:.6mm 4mm;border-radius:99px}
  .badge .code{font-family:'IBM Plex Mono',monospace;font-size:7pt;color:var(--muted);margin-top:1mm}
  .foot{position:absolute;left:0;bottom:0;width:100%;height:10mm;background:var(--tc);color:#fff;font-weight:700;font-size:8pt;display:flex;align-items:center;justify-content:center;letter-spacing:.06em}
  .foot svg{display:block;width:100%;height:100%}
  /* A5 landscape room card */
  .a5{width:210mm;height:148mm;position:relative;background:#fff;display:grid;grid-template-columns:1fr 62mm;outline:0.2mm dashed #ccc;overflow:hidden}
  .a5 .left{position:relative;padding:0 0 12mm}
  .a5 .band{position:relative;background:var(--tl);padding:6mm 8mm 8mm}
  .a5 .band .logo{height:10mm}
  .a5 .band .theme{margin-top:2mm;font-weight:700;font-size:10pt;letter-spacing:.06em;color:var(--tc)}
  .a5 h1{font-family:'Fraunces',serif;font-size:26pt;line-height:1.05;margin:1mm 0 0}
  .a5 .sub{color:var(--muted);font-size:10pt}
  .a5 .band .row2{display:flex;align-items:center;gap:4mm;flex-wrap:wrap}
  .a5 .roomno{display:inline-block;margin-top:2mm;background:var(--tc);color:#fff;font-weight:700;padding:1mm 4mm;border-radius:99px;font-size:11pt}
  .a5 .ticks{padding:6mm 9mm 0;display:flex;flex-direction:column;gap:3.2mm}
  .a5 .ticks .h{font-weight:700;font-size:9pt;letter-spacing:.08em;color:var(--tc)}
  .a5 .tk{display:flex;gap:4mm;align-items:center;font-size:13pt}
  .a5 .tk .bx{flex:0 0 6.5mm;height:6.5mm;border:0.6mm solid var(--tc);border-radius:1.2mm;background:#fff}
  .a5 .plan{padding:3mm 8mm 0;display:grid;grid-template-columns:1fr 1fr;gap:5mm;font-size:8.6pt;line-height:1.25}
  .a5 .plan .h{font-weight:700;font-size:8pt;letter-spacing:.08em;color:var(--tc);margin-bottom:1.2mm}
  .a5 .plan .r{display:grid;grid-template-columns:10mm 1fr;margin-bottom:.8mm}
  .a5 .plan b{font-weight:700}
  .a5 .plan .r.mv{background:#FFE9B8;font-weight:700;border-radius:1mm;padding:0 1mm;margin-left:-1mm}
  .a5 .right{position:relative;background:var(--tl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;padding:6mm 6mm 14mm;text-align:center}
  .a5 .right .msg{font-family:'Fraunces',serif;font-weight:700;font-size:15pt;color:var(--tc);line-height:1.15}
  .a5 .right .qr img{width:42mm;height:42mm;display:block;background:#fff;padding:2mm;border-radius:3mm}
  .a5 .right .how{font-size:9pt;color:var(--muted)}
  .a5 .right .code{font-family:'IBM Plex Mono',monospace;font-size:7pt;color:var(--muted)}
  /* generic cards (decks, sites, tents) */
  .card{border:0.6mm solid var(--line);border-radius:5mm;padding:5mm 6mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;overflow:hidden;position:relative}
  .card .top{font-size:9pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tc,var(--accent))}
  .card .big{font-family:'Fraunces',serif;font-weight:700;font-size:20pt;line-height:1.05}
  .card .qr img{width:40mm;height:40mm;display:block}
  .card .how{font-size:8.5pt;color:var(--muted)}
  .card .desc{font-size:11pt;line-height:1.35;text-align:left}
  .sf{margin-top:2mm;padding-top:1.5mm;border-top:0.3mm dashed #bbb;width:100%;display:flex;align-items:center;justify-content:center;gap:2mm;font-size:7.5pt;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#555}
  .sf img{height:4.5mm}
  .tent{display:grid;grid-template-columns:1fr 34mm;gap:4mm;align-items:start;text-align:left}
  .tent .qr img{width:32mm;height:32mm}
  .site{border-top:3mm solid var(--tc);border-radius:4mm;padding:8mm;font-size:13pt;line-height:1.5}
  .site h2{font-family:'Fraunces',serif;font-size:24pt;margin:0 0 4mm}
  .poster{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9mm;min-height:270mm;text-align:center}
  .poster h1{font-family:'Fraunces',serif;font-weight:700;font-size:44pt;margin:0;line-height:1}
  .poster .url{font-weight:700;font-size:28pt;color:var(--accent)}
  .poster .qr img{width:115mm;height:115mm}
  .agenda h3{margin:5mm 0 1.5mm;font-size:13pt}
  .ag{display:flex;flex-direction:column;border-top:0.5mm solid var(--ink)}
  .ag>div{display:grid;grid-template-columns:28mm 1fr 46mm;gap:3mm;padding:1.8mm 2mm;border-bottom:0.2mm solid #d6e0e2;font-size:10.5pt}
  .ag>div span:last-child{color:var(--muted)}
  .ag>div.mv{background:#FFE9B8;font-weight:700}
  .ag>div.mv span:last-child{color:var(--ink)}
  .key{display:inline-block;width:4mm;height:4mm;background:#FFE9B8;border:0.2mm solid #E0B95A;vertical-align:middle}
  .a4l{width:297mm;height:210mm;padding:12mm}
  .halves{grid-template-columns:1fr;grid-auto-rows:1fr;gap:0;padding:0}
  .half{display:flex;align-items:center;justify-content:center;border-bottom:0.3mm dashed #bbb;padding:10mm;text-align:center}
  .tl-head .mo{font-family:'Fraunces',serif;font-weight:700;font-size:54pt;line-height:1.05;color:var(--accent)}
  .kick{font-size:10pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tc,var(--accent))}
  .tl-key{display:flex;flex-direction:column;gap:5mm;font-size:24pt;font-weight:700;text-align:left}
  .tl-key .row3{display:flex;gap:6mm;align-items:center}.sw{width:18mm;height:18mm;border-radius:2mm;display:inline-block}.sw.g{background:#8FD18B}.sw.r{background:#F28B82}.sw.y{background:#FFE07A}
  .fold{grid-template-rows:1fr 1fr;padding:0}.foldhalf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4mm;border-bottom:0.3mm dashed #bbb}.foldhalf:first-child{transform:rotate(180deg)}
  .foldhalf .tname{font-family:'Fraunces',serif;font-weight:700;font-size:64pt;color:var(--tc)}
  .sign{display:flex;flex-direction:column;align-items:center;gap:6mm;padding:14mm;text-align:center}.sign h2{font-family:'Fraunces',serif;font-size:40pt;margin:0;line-height:1.05}.sign p{font-size:15pt;margin:0}
  .lpw{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;width:100%;margin-top:6mm}.lpw div{border:0.6mm solid var(--accent);border-radius:4mm;padding:8mm 4mm;display:flex;flex-direction:column;gap:2mm}.lpw b{font-size:22pt;color:var(--accent)}
  .ws{width:100%;border-collapse:collapse;font-size:11pt}.ws th,.ws td{border:0.3mm solid #9fb3b7;padding:3mm 2mm;text-align:left}.ws td{height:12mm}.ws th:first-child,.ws td:first-child{width:9mm}.ws th:nth-child(2){width:18mm}
  .quarters{grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:0;padding:0}.pc{border:0.3mm dashed #bbb;padding:8mm;display:flex;flex-direction:column;gap:3.5mm}.pcl{font-family:'Fraunces',serif;font-size:15pt;font-weight:700}.ln{border-bottom:0.3mm solid #c5d2d5;height:7mm}.pcf{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:9pt;color:var(--muted)}.pcf img{height:8mm}
  .cert{height:100%;border:2mm double #C9A227;border-radius:4mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5mm;text-align:center}.cert .gd{font-family:'Fraunces',serif;font-size:20pt;color:#A07C10;font-weight:700;letter-spacing:.04em}.cert h2{font-family:'Fraunces',serif;font-size:40pt;margin:0}.cert .to{font-size:13pt;color:var(--muted)}.cert .nm{width:150mm;border-bottom:0.5mm solid var(--ink);height:16mm}
  .hotel{padding:4mm 6mm;font-size:12pt;line-height:1.5}.hotel h2{font-size:18pt;margin:1mm 0}.hotel h3{font-size:13pt;margin:6mm 0 1mm;color:var(--accent)}.hotel ul{margin:0;padding-left:6mm}
  .a4l .ref{width:100%;border-collapse:collapse;font-size:7pt;margin-top:3mm}.ref th,.ref td{border:0.25mm solid #9fb3b7;padding:1.4mm 1.2mm;text-align:left;vertical-align:top}.ref th{background:#E3F2F3;font-size:7.2pt}.ref.key{font-size:10pt}.ref.key td{padding:2.5mm}
  .clues{padding:2mm 4mm}.clues h2{font-family:'Fraunces',serif;font-size:24pt;margin:0}.clues ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.6mm}.clues li{display:flex;gap:3mm;align-items:flex-start;font-size:9.6pt;line-height:1.3;border-bottom:0.2mm solid #e1e8ea;padding-bottom:1.4mm}.clues li small{display:block;color:var(--muted);font-size:8pt}.clues li.gold b{color:#A07C10}.clues .cb{flex:0 0 4.5mm;height:4.5mm;border:0.4mm solid var(--tc);border-radius:1mm;margin-top:.5mm}
  .wbox{border:0.5mm solid var(--accent);border-radius:3mm;height:95mm;padding:3mm 4mm;font-size:12pt;color:var(--accent)}
  .a4.tents2{grid-template-columns:1fr;grid-auto-rows:134mm}.tent-l .desc{font-size:14pt;line-height:1.45}.tent-l{grid-template-columns:1fr 46mm}.tent-l .qr img{width:44mm;height:44mm}
  .scen{border-top:4mm solid var(--accent);padding:12mm;display:flex;flex-direction:column;gap:5mm}
  .scen h2{font-family:'Fraunces',serif;font-size:30pt;margin:0}
  .scen p{font-size:14pt;line-height:1.5;margin:0}
  @media print{
    body{background:#fff}
    .hub,.preview-bar{display:none !important}
    #out{padding:0}
    .sheet{margin:0;page-break-after:always;break-after:page}
    .badge,.a5{outline:0}
  }
  @media screen and (max-width:820px){.sheet{transform-origin:top left}}
</style>
<style id="page">@page{size:A4;margin:0}</style>
</head>
<body>
<div class="hub" id="hub">
  <div class="row" style="justify-content:space-between"><img src="/logo.png" alt="WaSH Sector Lebanon" style="height:40px"><a class="btn" href="/host">Back to host</a></div>
  <h1>Print day checklist</h1>
  <p class="muted" style="margin:0">Everything to print for Where the Waters Meet. Tick each item once printed; the ticks stay on this computer.</p>
  <section class="box" id="roomsBox"><p class="muted">Loading…</p></section>
  <section class="box"><h2>Print</h2><div id="items"></div></section>
  <section class="box"><h2>Bring and buy</h2><p class="small muted" style="margin:0">Things to pack. Tick them as they go in the car.</p><div id="others"></div></section>
</div>
<div class="preview-bar" id="pbar" hidden>
  <button class="btn" id="back">← Back to the checklist</button>
  <strong id="ptitle"></strong>
  <span class="row" id="pmode"></span>
  <button class="btn primary" id="go">Print</button>
  <span class="small muted" id="phint"></span>
</div>
<div id="out"></div>
<div id="tmp" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/config.js"></script>
<script src="/lib.js"></script>
<script src="/sap.js"></script>
<script>
(async function () {
  const { $, esc, rows, rpc } = WR;
  if (!WR.configured) { $('#hub').innerHTML = '<p>Add the Supabase details in config.js first.</p>'; return; }
  const cache = {};
  function qr(text) {
    if (cache[text]) return cache[text];
    const t = $('#tmp'); t.innerHTML = '';
    new QRCode(t, { text, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
    const c = t.querySelector('canvas'); return (cache[text] = c ? c.toDataURL('image/png') : '');
  }
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const host = location.host.replace(/^www\./, ''); const O = location.origin;
  let cards, spots, tents, teams;
  async function load() {
    [cards, spots, tents, teams] = await Promise.all([rows('hunt_cards', (q) => q.order('position')), rows('hunt_spots', (q) => q.order('position')), rows('sap_tents', (q) => q.order('team_id').order('number')), rows('teams', (q) => q.order('id'))]);
  }
  await load();
  const tname = (id) => (teams.find((t) => t.id === id) || {}).name || 'Team ' + id;
  const tc = (id) => 'tc' + (((id || 1) - 1) % 3 + 1);
  const FAC = { code: '', holder: 'Mahdi Wehbi', team_id: null, fac: true };
  const badges = () => cards.filter((c) => /^R\d/.test(c.code)).concat([FAC]);
  const beds = () => cards.filter((c) => /^H\d/.test(c.code));
  const W = '<svg viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"><path d="M0 3 C12 0 25 6 37 3 C50 0 62 6 75 3 C87 0 95 5 100 3 V6 H0 Z" fill="#fff"/></svg>';
  const WF = '<svg viewBox="0 0 100 4" preserveAspectRatio="none" aria-hidden="true"><path d="M0 2 C12 0 25 4 37 2 C50 0 62 4 75 2 C87 0 95 3 100 2 V4 H0 Z" fill="currentColor"/></svg>';
  const sf = (t) => `<div class="sf"><img src="/logo.png" alt="">${esc(t)}</div>`;

  const TICKS = ['Be back at <b>15:00 sharp</b> in the meeting room', 'Be down at <b>17:00 sharp</b> to move to Wadi Chamsine', 'Take your breakfast and <b>check out before 11:00</b>', 'We move at <b>11:30 sharp</b> to Taanayel'];
  const roomOf = (name) => { const n = String(name || '').trim().toLowerCase(); const h = cards.find((x) => /^H\d/.test(x.code) && String(x.holder || '').trim().toLowerCase() === n && x.room); return h ? h.room : ''; };
  const back = (c) => `<div class="badge back ${c.fac ? 'tcf' : tc(c.team_id)}"><div class="bhead"><img src="/logo.png" alt=""><div><div class="theme">AGENDA</div><div class="ev">Times in yellow: be there, we move</div></div></div>
      ${AGENDA.map(([d, rows]) => `<div class="bday">${esc(d)}</div>${rows.map(([t, x, pl, mv, sh]) => `<div class="br ${mv ? 'mv' : ''}"><b>${esc(t.split('–')[0])}</b><span>${esc(sh || x)}</span></div>`).join('')}`).join('')}
      <div class="foot"><span style="position:absolute;left:0;top:-3mm;width:100%;height:4mm;color:var(--tc)">${WF}</span>${esc((c.holder || '').toUpperCase())} · ${c.fac ? 'THE WATERMAN' : esc(tname(c.team_id).toUpperCase())}</div></div>`;
  // Double-sided: A4 backs are mirrored left-right so they line up when the sheet flips on the long edge.
  const duplexA4 = (list) => chunk(list, 4).map((g) => { const b = g.slice(); while (b.length < 4) b.push(null); const m = [b[1], b[0], b[3], b[2]];
    return `<section class="sheet a4 badges">${g.map(badge).join('')}</section><section class="sheet a4 badges">${m.map((c) => c ? back(c) : '<div></div>').join('')}</section>`; }).join('');
  const badge = (c) => { const [f, ...l] = (c.holder || '______').split(' ');
    if (c.fac) return `<div class="badge tcf"><div class="band">${W}</div><img class="logo" src="/logo-t.png" alt="WaSH Sector Lebanon"><div class="theme">WHERE THE WATERS MEET</div><div class="ev">WASH Sector Coordination Team Retreat</div>

    { k: 'timeline', t: 'Upstream timeline wall headers', n: () => '3 flip chart titles + 9 date headers, 2 per page', size: 'A4', render: () => page2([['fc', 'What worked well', 'g'], ['fc', 'What did not work', 'r'], ['fc', 'What surprised us', 'y']].concat(MONTHS.map((m) => ['m', m])), ([k, m, c]) => k === 'fc' ? half(`<div class="tl-key"><div class="kick">Upstream · flip chart</div><div class="row3" style="font-size:40pt;font-family:Fraunces,serif"><span class="sw ${c}"></span>${esc(m)}</div></div>`) : k === 'key' ? half(`<div class="tl-key"><div class="kick">Upstream · timeline wall</div><div class="row3"><span class="sw g"></span>Green: it worked</div><div class="row3"><span class="sw r"></span>Red: it broke down</div><div class="row3"><span class="sw y"></span>Yellow: it surprised us</div></div>`) : half(`<div class="tl-head"><div class="kick">Upstream · timeline wall</div><div class="mo">${esc(m)}</div></div>`)) },
    { k: 'extract', t: 'Murky Waters: Referrals tab extract', n: () => '3 copies (one per team) + 1 facilitator key · ' + REF.length + ' real rows from the 2026 war sheet', size: 'A4 landscape', page: () => 'A4 landscape',
      render: () => teams.map((t) => chunk(REF, 19).map((g, i) => `<section class="sheet a4l"><div class="kick">Murky Waters · 2026 war sheet, Referrals tab · ${esc(tname(t.id))} · page ${i + 1}</div><table class="ref"><thead><tr><th>#</th><th>Date</th><th>Area</th><th>Source</th><th>Emergency tag</th><th>Location</th><th>Type of referral</th><th>Additional information</th><th>Category</th><th>Cost estimation</th><th>Partner</th><th>Status</th><th>Duration</th><th>Notes</th></tr></thead><tbody>${g.map((r) => `<tr>${r.map((x) => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`).join('')).join('')
        + `<section class="sheet a4l"><div class="kick">Murky Waters · facilitator key (do not hand out)</div><h2 style="font-family:Fraunces,serif;margin:2mm 0 4mm">What is hiding in the extract</h2><table class="ref key"><thead><tr><th>Problem</th><th>Where</th><th>Rule for the future referral tool</th></tr></thead><tbody>${REFKEY.map((k) => `<tr>${k.map((x) => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></section>` },
    { k: 'murky', t: 'Murky Waters worksheets', n: () => '3 worksheets, one per team (with the Referrals extract)', size: 'A4', render: () => teams.map((t) => `<section class="sheet a4 one"><div class="sign" style="align-items:stretch;text-align:left;gap:4mm"><div class="kick">Murky Waters · data detective · ${esc(tname(t.id))}</div><h2 style="font-size:24pt">The 2026 Referrals tab</h2><p style="font-size:12pt">8 minutes. Write freely: what is wrong in the extract, then what a future referral tool should do about it. Copy it into your phone to present.</p><div class="wbox"><b>Problems we found</b></div><div class="wbox"><b>Suggestions: what a future referral tool should do</b></div></div></section>`).join('') },
    { k: 'hotel', t: 'Hotel sheet: room setup and schedule', n: () => '1 page for the hotel', size: 'A4', render: () => `<section class="sheet a4 one"><div class="hotel"><div class="row" style="justify-content:space-between"><div><div class="kick">For the hotel</div><h2>WASH Coordination Team Retreat · 22–23 October 2026</h2></div><img src="/logo-t.png" alt="" style="height:14mm"></div>
      <h3>Meeting room · Thursday 22 October, 09:30–16:00</h3><ul><li>3 round tables (6, 6 and 7 chairs) and 1 facilitator table at the front</li><li>5 small side tables along the walls (stations)</li><li>Screen and projector with HDMI, speakers, 1 wireless microphone if available</li><li>4 flip chart stands with paper and markers; permission to tape paper along one wall (about 5 m)</li><li>Open floor of about 4 × 3 m in front of the screen</li><li>Reliable Wi-Fi for about 20 phones; power extensions at the front and near the stations</li><li>Water on each table</li></ul>
      <h3>Food and rooms</h3><ul><li>Open coffee station 10:00–12:00, in or beside the room, for 20</li><li>Lunch at 14:00 in the restaurant, for 20</li><li>Room check-in during lunch, 14:00–15:00, for 17 overnight guests</li><li>No hotel dinner on Thursday (we eat at Wadi Chamsine)</li><li>Breakfast on Friday 09:00–10:30, for 17</li><li>Check-out by 11:00 on Friday; we leave at 11:30</li><li>Dietary needs: [TO CONFIRM]</li></ul>
      <p class="muted">Contact: Dr. Mahdi Wehbi, 70319729</p></div></section>` }
  ];
  ITEMS.splice(ITEMS.findIndex((x) => x.k === 'poster') + 1, 0, ...MORE);
  const BRING = [
    ['Badges', 'Badge holders and lanyards for 19 people'], ['Envelopes', '6 envelopes for the sealed theme cards and scenario cards'],
    ['Sticky notes', 'Sticky notes in 3 colours: green, red, yellow (about 3 pads each)'],
    ['Paper roll', 'A long paper roll (about 5 m) and masking tape for the timeline wall'], ['Tape', 'Masking tape for the Lebanon floor map'],
    ['Markers', 'Markers for flip charts and sticky notes'], ['Flip charts', 'Flip chart pads (the hotel provides the 4 stands)'],
    ['Balloons', 'Balloons (2 per team plus spares), bamboo skewers, a little cooking oil'], ['Helium stick', 'A light stick or tent pole, a blindfold, 20 paper cups'],
    ['Marshmallow', 'Spaghetti, tape, string and marshmallows (marshmallow challenge)'], ['Prizes', 'Small prizes for the word race winners'],
    ['Tech', 'Laptop, HDMI adapter, extension cable, clicker'], ['Power', 'Power banks for Day 2 at the lake'],
    ['Day 2', 'Clipboards or a folder for each team leader (WAP deck, site and tent cards)'],
    ['Leaky-cup relay', 'For golden card G2 at the lake: paper cups with small holes and 3 empty bottles'], ['Pens', 'Pens for the sticky notes and worksheets'],
    ['Reset', 'After testing: Host → Reset → Reset everything']];

  function roomsBox() {
    const B = beds(); const filled = B.filter((c) => c.room).length; const ans = store.get('wr-rooms-answer');
    const pin = WR.getPin && WR.getPin();
    let body = `<h2>First: do you have the room numbers?</h2><p class="small muted" style="margin:0">They go on the room welcome cards. Without them the cards print with no room line.</p>
      <div class="row"><button class="btn" data-ans="yes" aria-pressed="${ans === 'yes'}">Yes, I have them</button><button class="btn" data-ans="no" aria-pressed="${ans === 'no'}">Not yet: print without</button></div>`;
    if (ans === 'yes') {
      body += pin ? `<form id="rf" class="stack" style="display:flex;flex-direction:column;gap:10px"><div class="rooms">${B.map((c) => `<label for="r-${c.id}"><input id="r-${c.id}" name="${c.id}" value="${esc(c.room || '')}" placeholder="Room" inputmode="numeric"> ${esc(c.holder)}</label>`).join('')}</div><div class="row"><button class="btn primary">Save room numbers</button><span class="small muted">${filled} of ${B.length} filled</span></div></form>`
        : '<p class="notice">Open the host panel on this computer first (it keeps you signed in), then come back here to type the room numbers.</p>';
    } else if (ans === 'no') body += `<p class="notice" style="margin:0">OK: the room cards print without room numbers.${filled ? ` ${filled} card(s) still have a number saved; choose Yes to clear them.` : ''}</p>`;
    $('#roomsBox').innerHTML = body;
  }
  function hub() {
    roomsBox();
    $('#items').innerHTML = ITEMS.map((it) => `<div class="item"><input type="checkbox" data-done="${it.k}" aria-label="${esc(it.t)} printed" ${store.get('wr-printed-' + it.k) ? 'checked' : ''}><div><strong>${esc(it.t)}</strong><span class="small muted">${esc(it.n())} · ${esc(it.size)}</span></div><button class="btn primary" data-open="${it.k}">Preview and print</button></div>`).join('');
    $('#others').innerHTML = BRING.map(([t, d], i) => `<div class="item"><input type="checkbox" data-done="bring${i}" aria-label="${esc(t)} ready" ${store.get('wr-printed-bring' + i) ? 'checked' : ''}><div><strong>${esc(t)}</strong><span class="small muted">${esc(d)}</span></div><span></span></div>`).join('');
  }
  let cur = null, mode = null;
  function open(k, m) {
    cur = ITEMS.find((x) => x.k === k); mode = m || (cur.modes ? cur.modes[0][0] : null);
    $('#hub').hidden = true; $('#pbar').hidden = false; $('#ptitle').textContent = cur.t;
    $('#pmode').innerHTML = (cur.modes || []).map(([v, l]) => `<button class="btn" data-mode="${v}" aria-pressed="${v === mode}">${esc(l)}</button>`).join('');
    $('#phint').textContent = cur.hint ? cur.hint(mode) : 'A4, print at 100%.';
    $('#page').textContent = `@page{size:${cur.page ? cur.page(mode) : 'A4'};margin:0}`;
    $('#out').innerHTML = cur.render(mode);
    window.scrollTo(0, 0);
  }
  function close() { $('#hub').hidden = false; $('#pbar').hidden = true; $('#out').innerHTML = ''; $('#page').textContent = '@page{size:A4;margin:0}'; hub(); }
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('button,input'); if (!t) return;
    if (t.dataset.open) open(t.dataset.open);
    else if (t.dataset.mode) open(cur.k, t.dataset.mode);
    else if (t.id === 'back') close();
    else if (t.id === 'go') { window.print(); store.set('wr-printed-' + cur.k, '1'); }
    else if (t.dataset.done) store.set('wr-printed-' + t.dataset.done, t.checked ? '1' : '');
    else if (t.dataset.ans) { store.set('wr-rooms-answer', t.dataset.ans); roomsBox(); }
  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'rf') return; e.preventDefault();
    const fd = new FormData(e.target); const pin = WR.getPin();
    try {
      for (const [id, v] of fd.entries()) { const c = cards.find((x) => x.id === id); if (c && (c.room || '') !== String(v).trim()) await rpc('host_save_card', { p_pin: pin, p_id: id, p_data: { room: String(v).trim() } }); }
      await load(); roomsBox(); WR.toast('Room numbers saved');
    } catch (ex) { WR.toast(ex.message, 4000); }
  });
  hub();
})();
</script>
</body>
</html>
