<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Print Cards · WASH Retreat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root{--ink:#10262B;--muted:#53676C;--accent:#0A6E78;--gold:#A86B00;--line:#C8D8DA;--t1:#2F5DA8;--t2:#B8561A;--t3:#7442AD}
  *{box-sizing:border-box}
  body{margin:0;background:#E9EFF0;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
  .bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px max(16px,env(safe-area-inset-left,0px));background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  .bar label{display:flex;gap:6px;align-items:center;font-weight:600}
  .bar button{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .page{width:210mm;min-height:297mm;margin:12px auto;padding:10mm;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:88mm;gap:6mm;background:#fff}
  .page.one{grid-template-columns:1fr;grid-auto-rows:auto}
  .card{border:1.2mm dashed var(--line);border-radius:5mm;padding:5mm 6mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;break-inside:avoid;overflow:hidden}
  .top{font-size:9pt;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .big{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:22pt;line-height:1.05}
  .qr img{width:42mm;height:42mm;display:block}
  .code{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16pt;letter-spacing:.1em}
  .how{font-size:8.5pt;color:var(--muted)}
  .desc{font-size:11pt;line-height:1.35;text-align:left}
  .sf{margin-top:auto;padding-top:1.5mm;border-top:0.3mm dashed #bbb;width:100%;text-align:center;font-size:8pt;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#555}
  .room{border:0.6mm solid var(--ink);border-radius:3mm;padding:2mm 6mm;font-size:16pt;font-weight:600}
  .tent{display:grid;grid-template-columns:1fr 34mm;gap:4mm;align-items:start;text-align:left}
  .tent .qr img{width:32mm;height:32mm}
  .site{border-top:3mm solid var(--tc);border-radius:4mm;padding:8mm;font-size:13pt;line-height:1.5}
  .site h2{font-family:'Bricolage Grotesque',Arial,sans-serif;font-size:24pt;margin:0 0 4mm}
  .site ul{margin:0;padding-left:6mm}
  .poster{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10mm;min-height:270mm;text-align:center}
  .poster h1{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:44pt;margin:0;line-height:1}
  .poster .url{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:30pt;color:var(--accent)}
  .poster .qr img{width:120mm;height:120mm}
  .tc1{--tc:var(--t1)} .tc2{--tc:var(--t2)} .tc3{--tc:var(--t3)}
  @media print{body{background:#fff}.bar{display:none}.page{margin:0;page-break-after:always}@page{size:A4;margin:0}}
  @media screen and (max-width:820px){.page{width:100%;min-height:0;grid-template-columns:1fr;grid-auto-rows:auto}}
</style>
</head>
<body>
<div class="bar">
  <strong>Print</strong>
  <label for="s-poster"><input id="s-poster" type="checkbox" data-s="poster" checked> Join poster</label>
  <label for="s-rooms"><input id="s-rooms" type="checkbox" data-s="rooms" checked> Name badges (Day 1)</label>
  <label for="s-beds"><input id="s-beds" type="checkbox" data-s="beds" checked> Room welcome cards (Day 1)</label>
  <label for="s-spots"><input id="s-spots" type="checkbox" data-s="spots" checked> WAP decks (1 per team leader)</label>
  <label for="s-sites"><input id="s-sites" type="checkbox" data-s="sites" checked> Site cards (shawish)</label>
  <label for="s-tents"><input id="s-tents" type="checkbox" data-s="tents" checked> Tent cards</label>
  <button id="print">Print</button>
</div>
<div id="out"><p style="padding:20px">Loading…</p></div>
<div id="tmp" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/config.js"></script>
<script src="/lib.js"></script>
<script src="/sap.js"></script>
<script>
(async function () {
  const { $, esc, rows } = WR;
  $('#print').addEventListener('click', () => window.print());
  if (!WR.configured) { $('#out').innerHTML = '<p style="padding:20px">Add the Supabase details in config.js first.</p>'; return; }
  const cache = {};
  function qr(text) {
    if (cache[text]) return cache[text];
    const t = $('#tmp'); t.innerHTML = '';
    new QRCode(t, { text, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
    const c = t.querySelector('canvas'); return (cache[text] = c ? c.toDataURL('image/png') : '');
  }
  const host = location.host.replace(/^www\./, ''); const O = location.origin;
  const [cards, spots, tents, teams] = await Promise.all([rows('hunt_cards', (q) => q.order('position')), rows('hunt_spots', (q) => q.order('position')), rows('sap_tents', (q) => q.order('team_id').order('number')), rows('teams', (q) => q.order('id'))]);
  const tname = (id) => (teams.find((t) => t.id === id) || {}).name || 'Team ' + id;
  const pages = (items, per, cls, fn) => { let h = ''; for (let i = 0; i < items.length; i += per) h += `<section class="page ${cls || ''}">${items.slice(i, i + per).map(fn).join('')}</section>`; return h; };

  const S = {
    poster: () => `<section class="page one"><div class="poster"><img src="/logo.png" alt="WaSH Sector Lebanon" style="height:22mm;width:auto"><div class="top">${esc(WR.cfg.eventName)}</div><h1>Scan to join the game</h1><div class="qr"><img src="${qr(O + '/')}" alt="QR code to join"></div><div class="url">${esc(host)}</div></div></section>`,
    rooms: () => pages(cards.filter((c) => /^R\d/.test(c.code)), 6, '', (c) => `<div class="card ${c.team_id ? 'tc' + ((c.team_id - 1) % 3 + 1) : ''}" style="${c.team_id ? 'border-color:var(--tc)' : ''}"><div class="top" style="${c.team_id ? 'color:var(--tc)' : ''}">${c.team_id ? esc(tname(c.team_id)) : 'WASH Retreat'}</div><div class="room" style="border:0;font-size:20pt">${c.holder ? esc(c.holder) : '______________'}</div>
      <div class="qr"><img src="${qr(O + '/card?c=' + encodeURIComponent(c.code))}" alt="QR code for ${esc(c.code)}"></div><div class="code" style="font-size:10pt">${esc(c.code)}</div>
      <div class="sf"><img src="/logo.png" alt="" style="height:5mm;width:auto;vertical-align:middle;margin-right:2mm">WASH Coordination Team Retreat · 22–23 Oct 2026</div></div>`),
    beds: () => pages(cards.filter((c) => /^H\d/.test(c.code)), 4, '', (c) => `<div class="card ${c.team_id ? 'tc' + ((c.team_id - 1) % 3 + 1) : ''}" style="${c.team_id ? 'border-color:var(--tc)' : ''}"><div class="top" style="${c.team_id ? 'color:var(--tc)' : ''}">WASH Sector Coordination Team Retreat</div>
      <div class="room" style="border:0;font-size:18pt">Welcome, ${esc((c.holder || '').split(' ')[0] || 'friend')}!</div>
      <div class="how" style="font-size:10pt;line-height:1.4">Rest well. At 17:00 we drive to Wadi Chamsine: ATV at sunset, then dinner together.<br>Bonus: scan the code and answer. A right answer gives ${esc(tname(c.team_id))} 2 points.</div>
      <div class="qr"><img src="${qr(O + '/card?c=' + encodeURIComponent(c.code))}" alt="QR code for ${esc(c.code)}"></div><div class="code" style="font-size:10pt">${esc(c.code)}</div>
      <div class="sf"><img src="/logo.png" alt="" style="height:5mm;width:auto;vertical-align:middle;margin-right:2mm">Day 1 · Room welcome card · ${esc(c.holder || '')}</div></div>`),
    spots: () => teams.map((t) => pages(spots, 6, '', (s) => `<div class="card"><div class="top">${esc(tname(t.id))} deck · ${esc(s.grp)}</div><div class="big">${esc(s.title)}</div>
      <div class="desc">${esc(s.description)}</div><div class="qr"><img src="${qr(O + '/spot?c=' + encodeURIComponent(s.code))}" alt="QR code for ${esc(s.code)}"></div><div class="how">Card ${esc(s.code)} · scan only if it answers one of your clues</div><div class="sf"><img src="/logo.png" alt="" style="height:5mm;width:auto;vertical-align:middle;margin-right:2mm">Day 2 · Taanayel · WAP challenge (part 1)</div></div>`)).join(''),
    sites: () => pages(teams, 1, 'one', (t) => `<div class="site tc${(t.id - 1) % 3 + 1}"><div class="top">WASH SAP test · site card</div><h2>${esc(tname(t.id))} · Site ${t.id}</h2>
      <p>You meet the shawish at the entrance. This is what he or she tells you and what you see:</p><ul>${(SAP.siteCards[t.id] || []).map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
      <p class="how">Fill this in the app: ${esc(host)}/sap → Fill the site form.</p><div class="sf"><img src="/logo.png" alt="" style="height:5mm;width:auto;vertical-align:middle;margin-right:2mm">Day 2 · Taanayel · Site test (part 2)</div></div>`),
    tents: () => pages(tents, 6, '', (t) => `<div class="card tc${(t.team_id - 1) % 3 + 1}" style="border-color:var(--tc)"><div class="top" style="color:var(--tc)">${esc(tname(t.team_id))} · Site ${t.team_id}</div>
      <div class="tent"><div><div class="big">Tent ${t.number}</div><div class="desc">${esc(t.card)}</div></div><div class="qr"><img src="${qr(O + '/sap?t=' + encodeURIComponent(t.code))}" alt="QR code for tent ${t.number}"></div></div>
      <div class="how">Scan to open the household form for this tent.</div><div class="sf"><img src="/logo.png" alt="" style="height:5mm;width:auto;vertical-align:middle;margin-right:2mm">Day 2 · Taanayel · Site test (part 2)</div></div>`)
  };
  function draw() {
    $('#out').innerHTML = Object.keys(S).filter((k) => $('#s-' + k).checked).map((k) => S[k]()).join('') || '<p style="padding:20px">Pick what to print above.</p>';
  }
  document.querySelectorAll('[data-s]').forEach((x) => x.addEventListener('change', draw));
  draw();
})();
</script>
</body>
</html>
