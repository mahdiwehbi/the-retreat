<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Print Cards · WASH Retreat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root{--ink:#10262B;--muted:#53676C;--accent:#0A6E78;--gold:#A86B00;--line:#C8D8DA}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
  .bar button{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .page{width:210mm;min-height:297mm;margin:12px auto;padding:10mm;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:88mm;gap:6mm;background:#fff;box-shadow:0 0 0 1px var(--line)}
  .poster{width:210mm;min-height:297mm;margin:12px auto;padding:22mm 18mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10mm;text-align:center;box-shadow:0 0 0 1px var(--line)}
  .poster h1{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:44pt;margin:0;line-height:1}
  .poster .url{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:30pt;color:var(--accent)}
  .poster .qr img{width:120mm;height:120mm}
  .card{border:1.5mm dashed var(--line);border-radius:5mm;padding:6mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;break-inside:avoid}
  .card.gold{border-color:var(--gold)}
  .card .top{font-size:9pt;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .card.gold .top{color:var(--gold)}
  .card .qr img{width:46mm;height:46mm}
  .card .code{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20pt;letter-spacing:.12em}
  .card .how{font-size:9pt;color:var(--muted)}
  @media print{.bar{display:none}.page,.poster{margin:0;box-shadow:none;page-break-after:always}@page{size:A4;margin:0}}
  @media screen and (max-width:820px){.page,.poster{width:100%;min-height:0;transform:none}.page{grid-template-columns:1fr;grid-auto-rows:auto}}
</style>
</head>
<body>
<div class="bar"><span><strong>Hunt cards</strong> · page 1 is the join poster, then 6 cards per A4 page. Cut along the dashed lines.</span><button id="print">Print</button></div>
<div id="out"><p style="padding:20px">Loading…</p></div>
<div id="tmp" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/config.js"></script>
<script src="/lib.js"></script>
<script>
(async function () {
  const { $, esc, rows } = WR;
  $('#print').addEventListener('click', () => window.print());
  if (!WR.configured) { $('#out').innerHTML = '<p style="padding:20px">Add the Supabase details in config.js first.</p>'; return; }
  function qr(text) {
    const t = $('#tmp'); t.innerHTML = '';
    new QRCode(t, { text, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
    const c = t.querySelector('canvas'); return c ? c.toDataURL('image/png') : (t.querySelector('img') || {}).src || '';
  }
  const host = location.host;
  const cards = await rows('hunt_cards', (q) => q.order('position').order('code'));
  let html = `<section class="poster"><div style="font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)">${esc(WR.cfg.eventName)}</div><h1>Scan to join the game</h1>
    <div class="qr"><img src="${qr(location.origin + '/')}" alt="QR code to join"></div><div class="url">${esc(host)}</div></section>`;
  for (let i = 0; i < cards.length; i += 6) {
    html += `<section class="page">${cards.slice(i, i + 6).map((c) => `<div class="card ${c.golden ? 'gold' : ''}">
      <div class="top">${c.golden ? 'Golden card · double points' : 'Treasure hunt card'}</div>
      <div class="qr"><img src="${qr(location.origin + '/card?c=' + encodeURIComponent(c.code))}" alt="QR code for card ${esc(c.code)}"></div>
      <div class="code">${esc(c.code)}</div>
      <div class="how">Scan with your phone camera, or open ${esc(host)}/card and type the code</div></div>`).join('')}</section>`;
  }
  $('#out').innerHTML = html;
})();
</script>
</body>
</html>
